  ica_id: RESP-1:CA-1-2:WRONG_TIMING:1
  ica_text: The escalation to human oversight is provided too late, after the medical
    explanation has been delivered to the patient.
  hazardous_context: The system detects the need for human intervention (via PM-1-3)
