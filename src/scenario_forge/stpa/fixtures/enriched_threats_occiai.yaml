  provenance: structural
  ica_id: RESP-1:CA-1-2:INCORRECT:1
  ica_text: The agent escalates the query to the wrong specialty or incorrect human
    administrative tier.
  hazardous_context: The agent misinterprets the context of the query or the feedback
    from FB-1-3 is corrupted.
  loss_scenario: A critical surgical query is escalated to a general administrative
    staff member instead of a clinical specialist due to incorrect context mapping,
    leading to a delay in life-critical medical intervention.
  related_hazards:
