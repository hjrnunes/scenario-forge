  provenance: structural
  ica_id: RESP-1:CA-1-1:NOT_PROVIDED:1
  ica_text: The agent fails to perform medical content verification against PM-1-2
    before presenting content to the user.
  hazardous_context: The system generates a medical explanation via the NLP Chatbot
    Engine that contains hallucinations or incorrect surgical steps.
  loss_scenario: An attacker uses prompt injection to bypass internal checks or the
    system fails to trigger the verification step, causing the chatbot to provide
    incorrect medical advice to a patient, leading to potential physical harm or incorrect
    self-treatment.
  related_hazards:
