    in PM-1-2.
  hazardous_context: The feedback channel FB-1-2 provides a manipulated or outdated
    version of the clinical guidelines (e.g., via RAG poisoning).
  loss_scenario: An attacker poisons the knowledge base used for clinical guidelines;
    the agent validates the generated content against this poisoned data, incorrectly
    marking inaccurate medical information as 'verified', which is then uploaded to
    the EHR.
  related_hazards:
  - H-1
  related_constraints:
  - SC-1
  catalog_mappings:
