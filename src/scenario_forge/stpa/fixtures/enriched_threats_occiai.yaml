  provenance: structural
  ica_id: RESP-1:CA-1-2:NOT_PROVIDED:1
  ica_text: The agent fails to trigger escalation to human staff (CP-7) when a query
    is identified as complex or unresolved.
  hazardous_context: The system encounters a medical query that falls outside the
    scope of the current PM-1-2 guidelines or involves high-risk clinical ambiguity.
  loss_scenario: The agent attempts to resolve a high-risk clinical query using only
    its internal model without escalating to a human; the resulting incorrect medical
    explanation is provided to the patient, causing harm.
  related_hazards:
  - H-1
  related_constraints:
  - SC-1
  catalog_mappings: []
  na_reconciliation_flag: false
