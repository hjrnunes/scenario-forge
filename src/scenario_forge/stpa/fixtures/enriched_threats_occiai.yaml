  provenance: structural
  ica_id: RESP-1:CA-1-1:WRONG_TIMING:1
  ica_text: The verification of medical content is performed after the content has
    already been sent to the user or the EHR upload API.
  hazardous_context: The control action CA-1-1 is triggered out of order in the generation
    pipeline.
  loss_scenario: The system sends a medical explanation to the patient interface before
    the verification process completes; if the verification subsequently fails, the
    incorrect information has already been consumed by the user, leading to medical
    error.
  related_hazards:
