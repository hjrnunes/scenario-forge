# Fixture: ControlStructure for the Klarna agentic payment assistant.
# Provenance: Handcrafted from manual prototype (Phase A) based on the
# Klarna use case. Provides a two-controller hierarchy (Payment Agent
# Controller and Knowledge Retrieval Controller) with process model
# parts, control actions, feedback channels, and a coordination link.
# Schema: scenario_forge.stpa.models.control_structure.ControlStructure

responsibilities:
  - resp_id: RESP-1
    description: Payment Agent Controller — orchestrates payment actions and user interaction
    responsibility_constraints:
      - rc_id: RC-1-1
        description: Must verify user identity before executing payments
      - rc_id: RC-1-2
        description: Must not expose raw payment data in responses
    process_model_parts:
      - pm_id: PM-1-1
        description: Current user intent and payment request state
        feedback_source:
          type: controlled_process
          id: CP-1
      - pm_id: PM-1-2
        description: User authentication and confirmation status
        feedback_source:
          type: responsibility
          id: RESP-1
    control_actions:
      - ca_id: CA-1-1
        description: Execute payment transaction
        target:
          type: controlled_process
          id: CP-1
      - ca_id: CA-1-2
        description: Request user confirmation for payment
        target:
          type: responsibility
          id: RESP-1
    feedback_channels:
      - fb_id: FB-1-1
        description: Payment transaction result
        updates: PM-1-1
        source:
          type: controlled_process
          id: CP-1
      - fb_id: FB-1-2
        description: User confirmation response
        updates: PM-1-2
        source:
          type: responsibility
          id: RESP-1

  - resp_id: RESP-2
    description: Knowledge Retrieval Controller — retrieves and grounds payment advice from knowledge base
    responsibility_constraints:
      - rc_id: RC-2-1
        description: Must validate retrieved content for payment accuracy
    process_model_parts:
      - pm_id: PM-2-1
        description: Current knowledge query and retrieved context state
        feedback_source:
          type: controlled_process
          id: CP-2
    control_actions:
      - ca_id: CA-2-1
        description: Query knowledge base
        target:
          type: controlled_process
          id: CP-2
    feedback_channels:
      - fb_id: FB-2-1
        description: Knowledge base retrieval results
        updates: PM-2-1
        source:
          type: controlled_process
          id: CP-2

controlled_processes:
  - cp_id: CP-1
    description: Payment transaction processing system
  - cp_id: CP-2
    description: Knowledge base and retrieval system

coordination_links:
  - link_id: CL-1
    source: RESP-1
    target: RESP-2
    shared_pm: PM-2-1
    coordination_mechanism:
      cm_id: CM-1
      description: Shared retrieved context for payment advice grounding
      payload: Structured context snippet with source attribution
    description: Payment Agent Controller requests grounding context from Knowledge Retrieval Controller
