# Abstract attack patterns for scenario-forge (Phase 3: T8/T9/T10/T14/T16).
# Domain-agnostic mechanism descriptions for the agentic-only threats — those
# with no NIST attack-class mapping.
# Each pattern is derived from an OWASP sub-scenario but strips domain-specific details,
# describing the attack mechanism rather than a specific target application.

source:
  name: "scenario-forge abstract attack patterns"
  version: "0.1.0"
  derived_from:
    - "OWASP Agentic AI Threats & Mitigations v1.1"
    - "NIST AI 100-2e2023"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # T8 — Repudiation & Untraceability (3 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T8-01:
    id: "AP-T8-01"
    threat_id: "T8"
    name: "Audit trail manipulation via logging gap exploitation"
    description: >
      An attacker exploits gaps or weaknesses in an AI agent's logging
      infrastructure to ensure that unauthorized actions are incompletely
      or inaccurately recorded. By targeting the boundary between action
      execution and log persistence, the attacker creates a divergence
      between what the agent did and what the audit trail reflects,
      undermining forensic reconstruction.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-AUDIT]
        any: [KC1.1, KC1.2, KC1.3, KC1.4]

  AP-T8-02:
    id: "AP-T8-02"
    threat_id: "T8"
    name: "Action obfuscation via minimal-trace interaction crafting"
    description: >
      An attacker designs interactions that cause the agent to take
      security-relevant actions while producing minimal or obscured log
      entries. By structuring requests to exploit edge cases in the
      agent's logging logic, the attacker ensures that investigators
      cannot reconstruct the sequence of events or attribute actions
      to their true source.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-AUDIT]
        any: [KC1.1, KC1.2, KC1.3, KC1.4]

  AP-T8-03:
    id: "AP-T8-03"
    threat_id: "T8"
    name: "Systematic audit trail degradation for compliance evasion"
    description: >
      An agent operating in a regulated context produces incomplete or
      inconsistent audit trails due to systematic logging failures that
      an attacker can trigger or amplify. The resulting gaps make it
      impossible for auditors to verify compliance, effectively shielding
      violations from detection while the agent continues to operate
      within its normal behavioral envelope.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-AUDIT]
        any: [KC1.1, KC1.2, KC1.3, KC1.4]

  # ═══════════════════════════════════════════════════════════════════
  # T9 — Identity Spoofing & Impersonation (6 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T9-01:
    id: "AP-T9-01"
    threat_id: "T9"
    name: "User impersonation via agent action attribution hijacking"
    description: >
      An attacker injects instructions into an agent that has delegated
      action capabilities (such as sending messages or initiating
      transactions), causing it to perform actions attributed to a
      legitimate user. The agent's privileged access to act on behalf
      of users is exploited to forge the apparent origin of actions,
      bypassing identity verification at the action layer.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC2.2, KC2.3, KC6.1.2]
    kill_chain:
      - step: discover_capabilities
        tactic: AML.TA0008
        techniques: [AML.T0084.001, AML.T0084.003]
        abstract_action: >
          Discover agent's delegated action capabilities (messaging, transactions)
          and attribution model.
      - step: craft_attribution_hijack
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft prompt injection to instruct agent to perform actions attributed
          to target user.
      - step: deliver_payload
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver crafted injection through a data channel the agent
          consumes.
      - step: inject_instructions
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Inject instructions through data channel agent consumes, triggering
          attribution hijack.
      - step: execute_delegated_actions
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          Agent performs actions using delegated capabilities, with attribution
          to legitimate user.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Unauthorized actions appear to originate from legitimate user,
          bypassing identity verification.

  AP-T9-02:
    id: "AP-T9-02"
    threat_id: "T9"
    name: "Agent identity spoofing via compromised service credentials"
    description: >
      An attacker compromises an agent's service credentials or
      registration mechanism, using the stolen identity to perform
      unauthorized operations that appear to originate from the
      legitimate agent. Because downstream systems and peer agents
      trust the spoofed identity, the attacker inherits the
      compromised agent's permissions and trust relationships across
      the system.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: initial_access
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Gain initial access to system hosting agent application.
      - step: enumerate_processes
        tactic: AML.TA0008
        techniques: [AML.T0089]
        abstract_action: >
          Enumerate running agent processes on victim's machine to identify
          credential targets.
      - step: extract_tokens
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0083]
        abstract_action: >
          Extract authentication tokens from agent process memory
          (e.g., /proc, process handle).
      - step: authenticate_as_agent
        tactic: AML.TA0015
        techniques: [AML.T0091.000]
        abstract_action: >
          Use stolen token to authenticate to LLM backend, impersonating
          agent identity.
      - step: access_llm_backend
        tactic: AML.TA0000
        techniques: [AML.T0040]
        abstract_action: >
          Obtain access to communicate directly with agent's LLM backend
          as spoofed identity.
      - step: inject_malicious_prompts
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Send malicious prompts to LLM under agent's ongoing conversations.
      - step: poison_session_context
        tactic: AML.TA0006
        techniques: [AML.T0080.001]
        abstract_action: >
          Craft prompts to manipulate context of agent's chat session
          for persistence.
      - step: conceal_injections
        tactic: AML.TA0007
        techniques: [AML.T0092]
        abstract_action: >
          Injected prompts remain hidden from victim in ongoing chat interface.
      - step: surveillance_and_impersonation
        tactic: AML.TA0011
        techniques: [AML.T0048.003]
        abstract_action: >
          Access all victim's chat activity with LLM, impersonating agent
          to backend.
      - step: service_disruption
        tactic: AML.TA0011
        techniques: [AML.T0029, AML.T0101]
        abstract_action: >
          Delete victim's chats or trigger rate-limiting denial of service.

  AP-T9-03:
    id: "AP-T9-03"
    threat_id: "T9"
    name: "Behavioral mimicry for trust-based access acquisition"
    description: >
      A rogue agent replicates the interaction patterns, communication
      style, and decision-making behavior of a trusted system agent.
      By presenting a convincing behavioral profile, the rogue agent
      passes implicit trust checks that rely on behavioral consistency
      rather than cryptographic identity, gaining unauthorized access
      to resources and peer agent cooperation.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC2.2, KC2.3, KC6.1.2]

  AP-T9-04:
    id: "AP-T9-04"
    threat_id: "T9"
    name: "Cross-platform identity adaptation for boundary bypass"
    description: >
      A malicious agent dynamically adapts its identity presentation
      to match the authentication requirements of different connected
      platforms or services. By altering credentials, metadata, or
      behavioral signatures to satisfy each platform's distinct
      verification model, the agent traverses security boundaries
      that assume identities are platform-specific and non-transferable.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T9-05:
    id: "AP-T9-05"
    threat_id: "T9"
    name: "False attribution attack via identity proxy exploitation"
    description: >
      An attacker exploits weak authentication controls to perform
      sensitive or prohibited actions under another user's identity.
      The agent system attributes the actions to the spoofed identity,
      creating a false audit trail that incriminates the victim while
      shielding the true attacker from accountability.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC2.2, KC2.3, KC6.1.2]
    kill_chain:
      - step: gather_victim_identity
        tactic: AML.TA0002
        techniques: [AML.T0087]
        abstract_action: >
          Collect victim identity information and biometric data from black
          market or open sources.
      - step: forge_identity_documents
        tactic: AML.TA0003
        techniques: [AML.T0017]
        abstract_action: >
          Create fake identity documents using stolen details and attacker's
          biometric data.
      - step: acquire_spoofing_tools
        tactic: AML.TA0003
        techniques: [AML.T0016.001, AML.T0016.002, AML.T0008.001]
        abstract_action: >
          Obtain deepfake tools, virtual camera software, and modified devices
          for identity spoofing.
      - step: generate_deepfake
        tactic: AML.TA0001
        techniques: [AML.T0088]
        abstract_action: >
          Generate deepfake video using acquired generative AI tools
          and victim's biometric data to produce a convincing spoofed
          identity presentation.
      - step: present_spoofed_identity
        tactic: AML.TA0000
        techniques: [AML.T0041, AML.T0047]
        abstract_action: >
          Present spoofed identity (deepfake video, forged documents) to
          AI-based authentication system.
      - step: evade_biometric_auth
        tactic: AML.TA0004
        techniques: [AML.T0015]
        abstract_action: >
          Successfully evade biometric authentication, gaining access under
          victim's identity.
      - step: false_attribution_impact
        tactic: AML.TA0011
        techniques: [AML.T0048, AML.T0048.001]
        abstract_action: >
          Perform actions attributed to victim identity, creating false
          audit trail.

  AP-T9-06:
    id: "AP-T9-06"
    threat_id: "T9"
    name: "Persistent agent identity takeover via long-lived credential theft"
    description: >
      An attacker obtains a long-lived authentication token or API key
      tied to an enterprise agent's formal identity. Using this
      persistent credential, the attacker bypasses the agent's
      conversational interface and its guardrails, directly accessing
      backend services and automation pipelines with the agent's full
      privilege set for an extended period.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: initial_access
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Gain initial access to system hosting long-lived agent credentials.
      - step: enumerate_credential_stores
        tactic: AML.TA0008
        techniques: [AML.T0089]
        abstract_action: >
          Enumerate agent processes and credential storage locations for
          long-lived tokens.
      - step: extract_long_lived_tokens
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0083]
        abstract_action: >
          Extract long-lived authentication tokens surviving across sessions.
      - step: authenticate_to_backend
        tactic: AML.TA0015
        techniques: [AML.T0091.000]
        abstract_action: >
          Use stolen long-lived token to authenticate to LLM backend with
          persistent validity.
      - step: establish_persistent_access
        tactic: AML.TA0000
        techniques: [AML.T0040]
        abstract_action: >
          Obtain persistent access to LLM backend independent of victim's
          active sessions.
      - step: inject_malicious_prompts
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Send malicious prompts to LLM under agent's ongoing conversations
          using long-lived token.
      - step: poison_session_context
        tactic: AML.TA0006
        techniques: [AML.T0080.001]
        abstract_action: >
          Manipulate agent's chat session context to maintain attacker
          influence within active sessions.
      - step: poison_memory_store
        tactic: AML.TA0006
        techniques: [AML.T0080.000]
        abstract_action: >
          Manipulate agent's memory store to maintain control across
          multiple victim sessions.
      - step: conceal_cross_session_activity
        tactic: AML.TA0007
        techniques: [AML.T0092]
        abstract_action: >
          Ongoing injected prompts remain hidden from victim across
          multiple sessions.
      - step: sustained_impersonation_impact
        tactic: AML.TA0011
        techniques: [AML.T0048.003, AML.T0029]
        abstract_action: >
          Sustained impersonation enables surveillance of victim's LLM
          activity and service disruption across sessions.

  # ═══════════════════════════════════════════════════════════════════
  # T10 — Overwhelming Human in the Loop (3 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T10-01:
    id: "AP-T10-01"
    threat_id: "T10"
    name: "Human oversight interface manipulation via artificial decision context"
    description: >
      An attacker compromises the interface between an AI agent and its
      human overseer by injecting artificial decision contexts that
      obscure critical information. The manipulated presentation causes
      the human reviewer to evaluate actions based on incomplete or
      misleading context, effectively neutralizing the oversight
      function while maintaining the appearance of human-in-the-loop
      control.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-HITL]
    kill_chain:
      - step: discover_oversight_structure
        tactic: AML.TA0002
        techniques: [AML.T0003, AML.T0006]
        abstract_action: >
          Discover the structure of the human oversight interface, including
          what contextual information is presented to reviewers alongside
          agent action requests.
      - step: probe_agent_mechanisms
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Interact with the AI agent to understand its oversight presentation
          mechanisms.
      - step: identify_presentation_patterns
        tactic: AML.TA0008
        techniques: [AML.T0084, AML.T0069]
        abstract_action: >
          Identify delimiters, formatting structures, and context presentation
          patterns used in human review interfaces.
      - step: craft_misleading_context
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft input designed to cause the agent to generate misleading
          decision contexts that obscure critical information from the
          human reviewer.
      - step: deliver_crafted_content
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver the crafted content through a data channel the agent
          consumes (e.g., email, document).
      - step: obfuscate_malicious_content
        tactic: AML.TA0007
        techniques: [AML.T0068, AML.T0067]
        abstract_action: >
          Obfuscate the malicious portion to evade detection by
          the recipient.
      - step: persist_in_rag
        tactic: AML.TA0006
        techniques: [AML.T0070]
        abstract_action: >
          The manipulated context persists in the RAG system and is
          retrieved whenever relevant queries occur.
      - step: activate_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          The injection activates and manipulates the agent's output
          generation, presenting actions with artificially constructed
          context.
      - step: neutralize_oversight
        tactic: AML.TA0007
        techniques: [AML.T0067]
        abstract_action: >
          The agent presents attacker-controlled context as verified
          information, neutralizing the oversight function.
      - step: approve_malicious_actions
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The human reviewer approves attacker-aligned actions based on
          the manipulated context, bypassing the human-in-the-loop
          security control.

  AP-T10-02:
    id: "AP-T10-02"
    threat_id: "T10"
    name: "Decision fatigue induction via approval request flooding"
    description: >
      An attacker overwhelms human reviewers with a high volume of
      approval requests, trivial alerts, or artificially urgent
      decision prompts. The sustained cognitive load induces decision
      fatigue, causing reviewers to rubber-stamp approvals or skip
      verification steps. The attacker embeds malicious requests
      within the flood, exploiting the degraded review quality to
      bypass security controls.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-HITL]
    kill_chain:
      - step: setup
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft inputs that cause the agent to generate a high
          volume of approval requests, trivial alerts, and
          artificially urgent decision prompts targeting the
          human review queue.
      - step: initial_access
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Gain access to the agent's input interface to submit
          the crafted inputs.
      - step: delivery
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Submit the crafted inputs to flood the human reviewer
          with a sustained stream of low-priority approval requests
          that induce cognitive overload.
      - step: evasion
        tactic: AML.TA0007
        techniques: [AML.T0068]
        abstract_action: >
          Embed the actual malicious action request within the flood
          of benign requests, obscuring it through volume rather
          than obfuscation of any individual request.
      - step: execution
        tactic: AML.TA0005
        techniques: [AML.T0053]
        abstract_action: >
          The agent executes the malicious action after the fatigued
          human reviewer rubber-stamps the request without adequate
          scrutiny.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The attacker's action is approved and executed with human
          authorization, bypassing the oversight control through
          induced decision fatigue rather than technical compromise.

  AP-T10-03:
    id: "AP-T10-03"
    threat_id: "T10"
    name: "Trust calibration degradation via incremental inconsistency injection"
    description: >
      An attacker gradually introduces subtle inconsistencies into an
      agent's outputs or behavior, eroding the human overseer's ability
      to calibrate trust. As the overseer encounters increasing
      unreliability, their confidence in distinguishing legitimate
      from malicious actions declines, reducing the effectiveness of
      human oversight as a security control and creating opportunities
      for undetected exploitation.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        all: [KCX-HITL]

  # ═══════════════════════════════════════════════════════════════════
  # T14 — Human Attacks on Multi-Agent Systems (4 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T14-01:
    id: "AP-T14-01"
    threat_id: "T14"
    name: "Coordinated privilege escalation via multi-agent identity chain compromise"
    description: >
      An attacker compromises the identity verification chain across
      multiple cooperating agents, causing one agent to falsely
      authenticate another. By manipulating the inter-agent trust
      handshake, the attacker creates a chain of fraudulent
      endorsements that escalates privileges beyond what any single
      agent would independently grant, bypassing multi-layer
      security controls.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T14-02:
    id: "AP-T14-02"
    threat_id: "T14"
    name: "Delegation loop exploitation for incremental privilege accumulation"
    description: >
      An attacker repeatedly escalates a request between interdependent
      agents, exploiting the assumption that a request passed by a peer
      agent has already been validated. Each delegation step adds
      implicit trust without independent verification, creating a
      feedback loop that incrementally grants elevated access until
      the attacker obtains privileges exceeding the authorization of
      any individual agent.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T14-03:
    id: "AP-T14-03"
    threat_id: "T14"
    name: "Multi-agent task saturation for security function denial"
    description: >
      An attacker floods a multi-agent system with continuous
      high-priority task requests, consuming the processing capacity
      of agents responsible for security monitoring, threat detection,
      or access control. The saturated security agents cannot process
      legitimate alerts, creating a window during which the attacker
      executes the primary attack undetected.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T14-04:
    id: "AP-T14-04"
    threat_id: "T14"
    name: "Cross-agent approval forgery via fragmented validation exploitation"
    description: >
      An attacker exploits inconsistencies between multiple agents that
      each perform partial identity or authorization checks. By
      satisfying each agent's individual validation criteria while
      failing composite checks, the attacker obtains approval for
      actions that would be rejected by any single agent performing
      full-scope verification. The fragmented validation creates
      gaps that the attacker threads through.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  # ═══════════════════════════════════════════════════════════════════
  # T16 — Insecure Inter-Agent Protocol Abuse (3 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T16-01:
    id: "AP-T16-01"
    threat_id: "T16"
    name: "Consent flow manipulation via protocol-level auto-approval injection"
    description: >
      An attacker crafts a malicious agent or endpoint that participates
      in an inter-agent protocol exchange but manipulates the consent
      negotiation flow. By injecting auto-approval signals or bypassing
      confirmation steps defined in the protocol, the attacker causes
      sensitive operations to execute without the explicit user intent
      or peer-agent agreement that the protocol is designed to enforce.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T16-02:
    id: "AP-T16-02"
    threat_id: "T16"
    name: "Context hijacking via crafted protocol response injection"
    description: >
      An attacker intercepts or crafts a server-side response within an
      inter-agent protocol implementation, injecting malicious context
      or tool metadata into the response payload. A receiving agent
      interprets the injected content as trusted protocol context and
      executes unintended operations, because the protocol's trust
      model does not validate the semantic integrity of response
      content beyond structural conformance.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: craft_malicious_context
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft malicious context or tool metadata designed to be injected
          into an inter-agent protocol response payload.
      - step: obfuscate_payload
        tactic: AML.TA0007
        techniques: [AML.T0068]
        abstract_action: >
          Obfuscate the malicious prompt within the response content to
          evade human detection.
      - step: stage_on_infrastructure
        tactic: AML.TA0003
        techniques: [AML.T0079]
        abstract_action: >
          Stage the malicious content on external infrastructure (website,
          MCP server, tool registry).
      - step: retrieve_poisoned_response
        tactic: AML.TA0004
        techniques: [AML.T0093, AML.T0078]
        abstract_action: >
          The receiving agent retrieves the poisoned protocol response
          (web scrape, tool metadata, RAG query).
      - step: execute_unintended_operations
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0053]
        abstract_action: >
          The agent interprets the injected content as trusted protocol
          context and executes unintended operations.
      - step: context_hijacking_impact
        tactic: AML.TA0011
        techniques: [AML.T0048, AML.T0101]
        abstract_action: >
          The agent performs attacker-specified actions due to context
          hijacking, such as data exfiltration or unauthorized tool
          invocations.

  AP-T16-03:
    id: "AP-T16-03"
    threat_id: "T16"
    name: "Tool capability misrepresentation via registry description poisoning"
    description: >
      An attacker embeds misleading, overly broad, or adversarially
      crafted tool descriptions in a shared tool registry or protocol
      metadata store. When a consuming agent selects and invokes the
      tool based on its description, it operates under false assumptions
      about the tool's scope and behavior, inadvertently leaking
      sensitive data or triggering privileged operations that the
      agent would not have authorized with accurate metadata.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KC2.3, KCX-MAGENT]
        any: [KC5.1, KC5.2, KC5.3, KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: stage_infrastructure
        tactic: AML.TA0003
        techniques: [AML.T0079]
        abstract_action: >
          Stage external infrastructure to host the poisoned tool or skill.
      - step: craft_tool_descriptions
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft misleading, overly broad, or adversarially crafted tool
          descriptions containing hidden prompt injections.
      - step: develop_poisoned_tool
        tactic: AML.TA0003
        techniques: [AML.T0104, AML.T0017]
        abstract_action: >
          Develop a poisoned tool/skill/extension containing malicious logic
          in metadata files (e.g., docstrings, rules files).
      - step: inflate_registry_reputation
        tactic: AML.TA0007
        techniques: [AML.T0111]
        abstract_action: >
          Inflate download counts or adoption metrics to increase perceived
          trustworthiness in the registry.
      - step: supply_chain_delivery
        tactic: AML.TA0004
        techniques: [AML.T0010.005]
        abstract_action: >
          Users download the poisoned extension from the registry through
          normal dependency management.
      - step: execute_hidden_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0011.002]
        abstract_action: >
          When the agent activates the poisoned extension, it reads all
          skill files, executing the hidden prompt injection.
      - step: invoke_privileged_tools
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          The injected instructions cause the agent to invoke privileged
          tools (e.g., command execution) based on the misleading tool
          description.
      - step: false_scope_impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The agent operates under false assumptions about the tool's scope,
          inadvertently leaking sensitive data or triggering privileged
          operations.
