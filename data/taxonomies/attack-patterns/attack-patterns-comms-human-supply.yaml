# Abstract attack patterns for scenario-forge (Batch C: T12/T15/T17).
# Domain-agnostic mechanism descriptions that replace concrete OWASP sub-scenario examples.
# Each pattern is derived from an OWASP sub-scenario but strips domain-specific details,
# describing the attack mechanism rather than a specific target application.

source:
  name: "scenario-forge abstract attack patterns"
  version: "0.1.0"
  derived_from:
    - "OWASP Agentic AI Threats & Mitigations v1.1"
    - "NIST AI 100-2e2023"

patterns:
  AP-T12-01:
    id: "AP-T12-01"
    threat_id: "T12"
    name: "Collaborative decision manipulation via inter-agent message injection"
    description: >
      An attacker injects crafted messages into inter-agent communication channels,
      introducing misleading data that gradually shifts the collective decision-making
      of a multi-agent system. Because each agent treats incoming peer messages as
      trusted input, the injected content compounds through successive reasoning steps,
      steering the group toward attacker-chosen objectives without triggering anomaly
      detection on any single message.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.backdoor_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: access_shared_channel
        tactic: AML.TA0000
        techniques: [AML.T0040, AML.T0047]
        abstract_action: >
          Access the shared communication channel or RAG system
          used by multiple agents.
      - step: craft_injection_payload
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft messages containing prompt injections designed to
          shift collective decision-making when consumed by peer
          agents.
      - step: inject_messages
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Inject the crafted messages into the inter-agent
          communication channel (shared RAG, message bus, knowledge
          store).
      - step: persist_in_shared_store
        tactic: AML.TA0006
        techniques: [AML.T0070, AML.T0080.000]
        abstract_action: >
          The injected messages persist in the shared data
          structure, affecting future agent queries and reasoning.
      - step: activate_in_peer_agents
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0051.002]
        abstract_action: >
          When other agents consume the poisoned messages, the
          injections activate and influence their reasoning
          processes.
      - step: collective_decision_shift
        tactic: AML.TA0011
        techniques: [AML.T0031, AML.T0048]
        abstract_action: >
          The collective decision-making of the multi-agent system
          gradually shifts toward attacker-chosen objectives.

  AP-T12-02:
    id: "AP-T12-02"
    threat_id: "T12"
    name: "Trust network exploitation via forged consensus"
    description: >
      An attacker forges consensus or validation messages within a multi-agent
      trust network, exploiting weak authentication between agents to make
      fabricated assertions appear as peer-validated facts. Downstream agents
      that rely on peer endorsement accept the forged consensus without
      independent verification, propagating attacker-controlled conclusions
      through the trust chain.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.backdoor_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T12-03:
    id: "AP-T12-03"
    threat_id: "T12"
    name: "Misinformation cascade via shared knowledge poisoning"
    description: >
      An attacker plants false data into a shared knowledge store or message
      channel used by multiple agents. The poisoned data propagates as agents
      consume, reason over, and re-emit it to peers, creating a cascade where
      each retransmission reinforces the false information. The attack can be
      tuned for either stealthy long-term degradation or rapid misinformation
      spread depending on the injection rate.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.backdoor_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: access_knowledge_store
        tactic: AML.TA0000
        techniques: [AML.T0040, AML.T0047]
        abstract_action: >
          Access the shared knowledge store or retrieval system
          consumed by multiple agents.
      - step: craft_false_data
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft false data designed to be consumed, reasoned over,
          and re-emitted by agents.
      - step: plant_poisoned_data
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Plant the poisoned data into the shared knowledge store
          (RAG database, vector store, shared memory).
      - step: persist_in_retrieval
        tactic: AML.TA0006
        techniques: [AML.T0070]
        abstract_action: >
          The false data persists in the retrieval system, activated
          when agents query on relevant topics.
      - step: trigger_false_incorporation
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0051.002]
        abstract_action: >
          Each agent retrieval triggers the injection, causing the
          agent to incorporate false information into its reasoning.
      - step: cascade_propagation
        tactic: AML.TA0006
        techniques: [AML.T0061, AML.T0080.001]
        abstract_action: >
          Agents re-emit the poisoned information through normal
          outputs, creating a self-reinforcing cascade.
      - step: misinformation_impact
        tactic: AML.TA0011
        techniques: [AML.T0031, AML.T0048.002]
        abstract_action: >
          Misinformation spreads through the agent network,
          degrading collective decision-making quality.

  AP-T12-04:
    id: "AP-T12-04"
    threat_id: "T12"
    name: "Communication channel manipulation via protocol-level interference"
    description: >
      An attacker exploits vulnerabilities in the transport or protocol layer
      of inter-agent communication to intercept, delay, reorder, or inject
      messages. By introducing artificial barriers or selectively dropping
      messages, the attacker partitions the agent network or forces agents
      to operate on stale or incomplete information, degrading coordination
      and enabling secondary attacks.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.backdoor_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T12-05:
    id: "AP-T12-05"
    threat_id: "T12"
    name: "Consensus mechanism exploitation via induced disagreement"
    description: >
      An attacker subtly perturbs inputs or intermediate results shared among
      agents engaged in collective decision-making, introducing artificial
      disagreements that prevent consensus. The induced conflicts erode the
      system's ability to converge on correct decisions, causing deadlock,
      fallback to weaker heuristics, or acceptance of attacker-preferred
      outcomes when tie-breaking logic activates.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.backdoor_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T15-01:
    id: "AP-T15-01"
    threat_id: "T15"
    name: "Trust-exploiting content substitution for fraudulent action"
    description: >
      An attacker uses indirect prompt injection to manipulate an AI assistant
      into substituting legitimate operational data (such as payment details
      or contact information) with attacker-controlled values. The human
      operator, trusting the AI-presented information as verified, acts on
      the substituted data without independent verification, completing a
      fraudulent transaction on the attacker's behalf.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.privacy_compromises"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: setup
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft content containing a hidden prompt injection designed
          to cause the AI assistant to substitute legitimate
          operational data with attacker-controlled values.
      - step: delivery
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver the poisoned content through a data channel the
          AI assistant consumes, such as an email, document, or
          knowledge base entry.
      - step: execution
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          The injection activates when the AI assistant processes
          the ingested content, causing it to follow attacker
          instructions to substitute operational data.
      - step: evasion
        tactic: AML.TA0007
        techniques: [AML.T0067, AML.T0068]
        abstract_action: >
          The substituted data is presented within the AI's normal
          response format, preserving the appearance of a verified,
          trustworthy output that does not trigger human suspicion.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048.000]
        abstract_action: >
          The human operator acts on the substituted data without
          independent verification, completing a fraudulent
          transaction that benefits the attacker.

  AP-T15-02:
    id: "AP-T15-02"
    threat_id: "T15"
    name: "AI-mediated social engineering via deceptive instruction generation"
    description: >
      An attacker compromises an AI assistant's output generation through
      indirect prompt injection, causing it to produce urgent, authoritative
      messages that direct users toward malicious actions such as clicking
      attacker-controlled links or disclosing credentials. The AI's
      established trust relationship with the user bypasses normal skepticism,
      making the social engineering significantly more effective than
      traditional phishing.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.privacy_compromises"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: craft_hijack_injection
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft a prompt injection designed to hijack the AI
          assistant's output generation, causing it to produce
          urgent, authoritative messages directing users toward
          attacker-controlled actions.
      - step: stage_social_engineering_payload
        tactic: AML.TA0003
        techniques: [AML.T0079, AML.T0008.002]
        abstract_action: >
          Stage malicious content (website, script) that will
          deliver the social engineering payload.
      - step: ingest_malicious_content
        tactic: AML.TA0004
        techniques: [AML.T0078, AML.T0093]
        abstract_action: >
          The user's AI agent accesses the malicious website or
          document, ingesting the injected prompt.
      - step: generate_deceptive_messages
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          The compromised AI assistant processes the injection and
          generates deceptive messages leveraging its established
          trust relationship with the user.
      - step: escalate_to_active_instruction
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          The injection causes the agent to escalate from passive
          information display to active instruction that prompts
          user actions (clicking buttons, running commands).
      - step: user_executes_malicious_action
        tactic: AML.TA0011
        techniques: [AML.T0048.003]
        abstract_action: >
          Users follow the AI-generated deceptive instructions,
          executing malicious actions on the attacker's behalf.

  AP-T17-01:
    id: "AP-T17-01"
    threat_id: "T17"
    name: "Upstream artifact poisoning via repository compromise"
    description: >
      An attacker injects malicious instructions or code into a public or
      shared repository that serves as an upstream dependency for an AI
      agent's prompt templates, tool definitions, or configuration. When the
      agent's build or deployment pipeline pulls the compromised artifact,
      the payload executes with the agent's full privileges, potentially
      affecting all downstream users before the compromise is detected.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "white_box"
      learning_stage: "deployment"
      attack_class: "genai.supply_chain"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC5.1, KC6.4]
    kill_chain:
      - step: stage_malicious_payload
        tactic: AML.TA0003
        techniques: [AML.T0079]
        abstract_action: >
          Stage malicious payload (e.g., JavaScript backdoor) on
          publicly accessible infrastructure.
      - step: craft_prompt_injection
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft prompt injection designed to cause agent to embed
          malicious elements in generated code.
      - step: obfuscate_in_config
        tactic: AML.TA0007
        techniques: [AML.T0068]
        abstract_action: >
          Hide prompt in configuration file using invisible Unicode
          characters (zero-width joiners, bidirectional markers).
      - step: distribute_poisoned_config
        tactic: AML.TA0004
        techniques: [AML.T0010.001]
        abstract_action: >
          Distribute poisoned configuration file through public
          repository or package registry where AI agent configs
          are shared.
      - step: persist_via_adoption
        tactic: AML.TA0006
        techniques: [AML.T0081]
        abstract_action: >
          Users pull the poisoned rules file, replacing their
          configuration and persisting the malicious content in
          their development environment.
      - step: execute_hidden_prompt
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          When agent initializes, it reads configuration file and
          hidden prompt executes.
      - step: jailbreak_guardrails
        tactic: AML.TA0007
        techniques: [AML.T0054]
        abstract_action: >
          Use jailbreak techniques to convince agent to add
          malicious elements to generated artifacts.
      - step: suppress_output_mentions
        tactic: AML.TA0007
        techniques: [AML.T0067]
        abstract_action: >
          Prompt instructs agent to suppress mention of code
          changes in responses to user.
      - step: impact_backdoored_code
        tactic: AML.TA0011
        techniques: [AML.T0048.003]
        abstract_action: >
          Developers use agent-generated code containing hidden
          backdoors, exfiltration logic, or vulnerable constructs.
    evidence:
      - source: "AML.CS0041"
        type: "enrichment"

  AP-T17-02:
    id: "AP-T17-02"
    threat_id: "T17"
    name: "Autonomous agent self-sabotage via unvalidated execution"
    description: >
      An autonomous code-generating agent, operating without adequate
      environment separation or output validation, hallucinates incorrect
      resource references, destroys legitimate data, and then produces
      falsified verification results to conceal the failure. The lack of
      supply chain integrity controls between the agent's generation,
      execution, and validation stages allows a single hallucination to
      cascade into data loss and deceptive reporting.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "white_box"
      learning_stage: "deployment"
      attack_class: "genai.supply_chain"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC5.1, KC6.4]
    kill_chain:
      - step: hallucinated_generation
        tactic: AML.TA0005
        techniques: [AML.T0050, AML.T0053]
        abstract_action: >
          Agent generates infrastructure code or automation workflows
          containing hallucinated resource references — wrong
          endpoints, incorrect paths, fabricated dependencies.
      - step: falsified_verification
        tactic: AML.TA0007
        techniques: [AML.T0067]
        abstract_action: >
          Agent produces falsified verification results, claiming
          tests pass or reporting success despite errors in the
          generated output.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048, AML.T0101]
        abstract_action: >
          Generated code executes with agent's privileges, destroying
          legitimate data or corrupting infrastructure due to
          hallucinated references.
