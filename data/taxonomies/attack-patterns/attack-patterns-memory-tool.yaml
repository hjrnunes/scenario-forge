# Abstract attack patterns for scenario-forge.
# Domain-agnostic mechanism descriptions for T1 (Memory Poisoning), T2 (Tool Misuse),
# T3 (Privilege Compromise), and T4 (Resource Overload).
#
# Canonical-chain migration (catalog-lineage.yaml v1, final authoritative
# dispositions): each record carries one branch-free total-order canonical
# chain with typed actions, typed references, provenance, and ATLAS mapping
# decisions. ATLAS is the sole v1 mapping authority (LAAF absent); SSSOM
# skos:relatedMatch rows remain unqualified migration provenance in the
# sibling .sssom.tsv file and never confer exact authority. The legacy
# kill_chain and evidence fields are removed; case-study grounding now lives
# in per-step provenance. Deferred sources (AP-T3-01, AP-T4-02, AP-T4-04)
# produce no live record and are removed from this file.
#
# Every chain's semantic_digest is recomputed with
# scenario_forge.models.attack_pattern.compute_chain_semantic_digest over the
# chain content; taxonomy_context pins the production resolver exactly.

source:
  name: scenario-forge abstract attack patterns
  version: 1.0.0
  derived_from:
  - OWASP Agentic AI Threats & Mitigations v1.1
  - NIST AI 100-2e2023
  - catalog-lineage.yaml v1 (authoritative dispositions)
  - MITRE ATLAS 2026.05 (sole v1 mapping authority)
patterns:
  AP-T1-01:
    id: AP-T1-01
    threat_id: T1
    name: Persistent memory rule injection
    description: Repeatedly reinforce a false operational rule in the agent's persistent memory until
      the agent treats it as established fact, so the fabricated rule overrides legitimate validation
      logic and authorizes actions that violate actual constraints. Owns the operational-rule/authorization-override
      effect within OG-01; factual-content compounding belongs to AP-T5-01.
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: black_box
      learning_stage: deployment
      attack_class: poisoning.targeted_poisoning
    prerequisite_capabilities:
      min_zones:
      - input
      - memory
      kc_requires:
        all:
        - KCX-PMEM
        any:
        - KC4.3
        - KC4.4
        - KC4.5
        - KC4.6
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T1-01
      chain_id: chain.1
      semantic_revision: 1
      semantic_digest: c50aa79db8eb555504cd8c6b56235a37e3e941e22a0fa83958c1b5deaa03c9c9
      taxonomy_context: &id002
        atlas:
          release: '2026.05'
          digest: defd9014c6d5f5954460ef438faea583fcb1830ff81e85709628efb43037cc3a
        laaf: null
        mapping_set_digest: 7c0f49feafa5c1ff15388aef58e45d30600a07b161e1ffa2c07200d6b6cb96f3
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0080.000
        - AML.T0051.001
      steps:
      - step_id: craft_payload
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: payload.rule.injection
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.craft.payload
          description: Rule-injection payload crafted with the false operational rule.
          security_relevant: false
          terminal: false
        order: 1
        attacker_controlled: true
        provenance:
          tier: observed
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          confidence: 90
          adaptation_rationale: Explicit against AML.CS0040 S00 (craft the injection payload); abstraction
            only, no adaptation.
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: The lineage asserts no exact step-level identity for payload crafting; AML.T0065
            is the AML.CS0040 S00 source assignment retained as provenance, not operational identity.
      - step_id: conceal_injection
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed:
        - kind: artifact
          ref_id: payload.rule.injection
          value_type: object
        produced:
        - kind: artifact
          ref_id: payload.concealed
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.conceal.injection
          description: Injection concealed inside innocuous-looking content.
          security_relevant: false
          terminal: false
        order: 2
        attacker_controlled: true
        provenance:
          tier: observed
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          confidence: 90
          adaptation_rationale: Explicit against AML.CS0040 S01; kept as its own defense-evasion step
            per the review-t1-t5.md wording correction (AML.T0068 was separated, not newly added).
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0068
      - step_id: deliver_payload
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: crossing
        action_kind: deliver
        consumed:
        - kind: artifact
          ref_id: payload.concealed
          value_type: object
        produced:
