          ref_id: channel.poisoned.content
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.deliver.payload
          description: Poisoned content delivered through the connected channel the agent treats as a
            trusted data source.
          security_relevant: true
          terminal: false
        order: 3
        attacker_controlled: true
        provenance:
          tier: observed
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          confidence: 90
