      resource_slots:
      - slot_id: ingress
        kind: entry_point
        purpose: initial_ingress
      - slot_id: context_window
        kind: integration
        purpose: target
      - slot_id: boundary
        kind: trust_boundary
        purpose: supporting
      initial_ingress_slot_id: ingress
