          ref_id: memory.false.rule
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.persist.in.memory
          description: False operational rule written into persistent memory so future sessions inherit
            it.
          security_relevant: true
          terminal: false
        order: 5
        attacker_controlled: true
        provenance:
          tier: observed
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          confidence: 90
          adaptation_rationale: 'Explicit against AML.CS0040 S04: the injection writes the false rule
            into the persistent memory store; memory-write persistence stays distinct from channel persistence.'
        mappings:
        - decision: exact
          taxonomy: ATLAS
          ids:
          - AML.T0080.000
      - step_id: persist_in_channel
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: persist
        consumed:
        - kind: state
          ref_id: channel.poisoned.content
          value_type: object
        produced:
        - kind: state
          ref_id: channel.persistent.vector
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.persist.in.channel
          description: Poisoned content persists in the shared channel as a continuing infection vector.
          security_relevant: true
          terminal: false
        order: 6
        attacker_controlled: false
        provenance:
          tier: observed
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          confidence: 90
          adaptation_rationale: Explicit against AML.CS0040 S05; channel-side persistence is a system
            state, distinct from the memory-write persistence of the injected rule.
        mappings:
        - &id001
          decision: not_applicable
          taxonomy: ATLAS
      - step_id: impact
        requirement: required
        condition: null
        executor_role: system
        boundary_position: inside
        action_kind: impact
        consumed:
        - kind: state
          ref_id: memory.false.rule
          value_type: object
        produced:
        - kind: effect
          ref_id: outcome.authorization.override
          value_type: boolean
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.impact
          description: 'The agent acts on the entrenched false rule and authorizes an action violating
            its real constraints: the first observable authorization-override outcome.'
          security_relevant: true
          terminal: true
        order: 7
        attacker_controlled: false
        provenance:
          tier: inferred
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          - reference_type: design_record
            reference_id: review-t1-t5.md
          confidence: 60
          adaptation_rationale: 'Inferred: AML.CS0040 S06 demonstrates downstream harm but not the authorization-override
            outcome; the override terminal follows from the entrenched-rule mechanism and is honestly
            tiered inferred per the lineage provenance plan.'
        mappings:
        - *id001
      earliest_attacker_controlled_step_id: craft_payload
      resource_slots:
      - slot_id: ingress
