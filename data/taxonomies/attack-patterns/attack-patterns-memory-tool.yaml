  AP-T1-02:
    id: AP-T1-02
    threat_id: T1
    name: Context window saturation for privilege escalation
    description: 'Fragment a privilege-escalation attempt across multiple turns within a session so each
      fragment stays below detection thresholds and the agent cumulatively loses track of prior authorization
      state, granting access it should deny. Strictly ephemeral: no cross-session persistence (that is
      AP-T1-01''s mechanism).'
    nist_classification:
      attacker_goal: integrity
      attacker_knowledge: gray_box
      learning_stage: deployment
      attack_class: poisoning.targeted_poisoning
    prerequisite_capabilities:
      min_zones:
      - input
      - memory
      kc_requires:
        any:
        - KC4.3
        - KC4.4
        - KC4.5
        - KC4.6
    canonical_chain:
      schema_version: v1
      pattern_id: AP-T1-02
      chain_id: chain.1
      semantic_revision: 1
      semantic_digest: cd1b056d4760e34aadfd810096e421b6fe2d43b14b98c4281c4a60fcbc032d82
      taxonomy_context: *id002
      mappings:
      - decision: exact
        taxonomy: ATLAS
        ids:
        - AML.T0051.000
      steps:
      - step_id: craft_fragments
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: outside
        action_kind: prepare
        consumed: []
        produced:
        - kind: artifact
          ref_id: payload.fragments
          value_type: object
        preconditions: []
        observable_postconditions:
        - postcondition_id: post.craft.fragments
          description: Below-threshold escalation fragments crafted against the target's authorization
            checks.
          security_relevant: false
          terminal: false
        order: 1
        attacker_controlled: true
        provenance:
          tier: variant
          references:
