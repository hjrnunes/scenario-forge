          rationale: The indirect-injection identity of this step is carried at chain level (AML.T0051.001);
            the lineage asserts no separate step-level identity.
      - step_id: persist_in_memory
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: inside
        action_kind: persist
        consumed:
        - kind: state
          ref_id: context.injection.active
          value_type: boolean
        produced:
