# Abstract attack patterns for scenario-forge.
# Domain-agnostic mechanism descriptions for T1 (Memory Poisoning), T2 (Tool Misuse),
# T3 (Privilege Compromise), and T4 (Resource Overload).
# Each pattern is derived from an OWASP sub-scenario but strips domain-specific details,
# describing the attack mechanism rather than a specific target application.

source:
  name: "scenario-forge abstract attack patterns"
  version: "0.1.0"
  derived_from:
    - "OWASP Agentic AI Threats & Mitigations v1.1"
    - "NIST AI 100-2e2023"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # T1 — Memory Poisoning (4 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T1-01:
    id: "AP-T1-01"
    threat_id: "T1"
    name: "Persistent memory rule injection"
    description: >
      An attacker repeatedly reinforces a false operational rule in the agent's
      persistent memory until the agent treats it as established fact. Once
      embedded, the fabricated rule overrides legitimate validation logic,
      causing the agent to authorize actions that violate its actual constraints.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "poisoning.targeted_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft adversarial prompt containing false operational rules.
      - step: conceal_injection
        tactic: AML.TA0007
        techniques: [AML.T0068]
        abstract_action: >
          Conceal prompt within content using steganographic techniques
          (invisible text, background-color matching).
      - step: deliver_payload
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver poisoned content through connected application channel
          treated as trusted data source.
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          User references shared content, agent ingests into context,
          hidden prompt executes.
      - step: persist_in_memory
        tactic: AML.TA0006
        techniques: [AML.T0080.000]
        abstract_action: >
          Injection writes attacker-controlled false rules into
          persistent memory store.
      - step: persist_in_channel
        tactic: AML.TA0006
        techniques: [AML.T0093]
        abstract_action: >
          Poisoned content remains in shared channel, acting as
          persistent infection vector.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048.003]
        abstract_action: >
          Agent operates with corrupted memory, authorizing
          constraint-violating actions.
    evidence:
      - source: "AML.CS0040"
        type: "enrichment"

  AP-T1-02:
    id: "AP-T1-02"
    threat_id: "T1"
    name: "Context window saturation for privilege escalation"
    description: >
      An attacker fragments a privilege escalation attempt across multiple
      sessions, exploiting the agent's finite context window. Each fragment
      stays below detection thresholds individually, but cumulatively the agent
      loses track of prior authorization state and grants access it should deny.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "poisoning.targeted_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "memory"]
      kc_requires:
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: craft_fragments
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft fragmented inputs designed to stay below per-input
          detection thresholds while cumulatively corrupting
          authorization state.
      - step: deliver_fragments
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver fragmented inputs across repeated interactions via
          normal channels.
      - step: execute_fragments
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Each fragment executes, consuming context window capacity
          and incrementally altering the agent's authorization state
          tracking.
      - step: escalate_privileges
        tactic: AML.TA0012
        techniques: [AML.T0054]
        abstract_action: >
          Agent grants access it should deny due to cumulative state
          corruption exceeding context capacity.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Attacker gains unauthorized access through fragmented
          privilege escalation.

  AP-T1-03:
    id: "AP-T1-03"
    threat_id: "T1"
    name: "Gradual threat-model erosion via memory drift"
    description: >
      An attacker incrementally alters the agent's stored threat definitions or
      classification criteria over successive interactions. The gradual drift
      causes the agent to progressively reclassify malicious activity as benign,
      creating a blind spot that permits undetected attacks.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "poisoning.targeted_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: gain_access
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Attacker gains ability to interact with agent and influence
          its learning/memory processes.
      - step: deliver_inputs
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver incremental inputs containing subtly altered threat
          definitions.
      - step: corrupt_memory
        tactic: AML.TA0006
        techniques: [AML.T0080.000]
        abstract_action: >
          Repeated adversarial inputs cause gradual corruption of
          stored threat classification criteria.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0031, AML.T0015]
        abstract_action: >
          Agent progressively reclassifies malicious activity as
          benign, creating detection blind spot.

  AP-T1-04:
    id: "AP-T1-04"
    threat_id: "T1"
    name: "Shared memory corruption for cross-agent influence"
    description: >
      An attacker writes false operational data into a memory structure shared
      among multiple agents. Other agents that read from this shared store
      incorporate the corrupted data into their decision-making, propagating
      incorrect behavior across the system without direct interaction with each
      affected agent.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "poisoning.targeted_poisoning"
    prerequisite_capabilities:
      min_zones: ["input", "memory", "inter_agent"]
      kc_requires:
        all: [KCX-SHMEM]
        any: [KC4.4, KC4.6]
    kill_chain:
      - step: gain_access
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Attacker gains ability to write to shared memory structure
          (RAG database, vector store, shared memory backend).
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft adversarial payload designed to corrupt shared memory
          and propagate across agents.
      - step: inject_payload
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Inject crafted payload into shared memory structure,
          activating the corruption mechanism.
      - step: poison_shared_memory
        tactic: AML.TA0006
        techniques: [AML.T0070, AML.T0080.000]
        abstract_action: >
          Inject false operational data into shared memory structure
          consumed by multiple agents.
      - step: propagate_corruption
        tactic: AML.TA0006
        techniques: [AML.T0080.000, AML.T0061]
        abstract_action: >
          Other agents read corrupted data from shared memory and
          incorporate it into their decision-making, propagating
          the corruption across the agent ecosystem.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0031]
        abstract_action: >
          Cross-agent behavior corruption propagates without direct
          interaction with each affected agent.

  # ═══════════════════════════════════════════════════════════════════
  # T2 — Tool Misuse (6 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T2-01:
    id: "AP-T2-01"
    threat_id: "T2"
    name: "Parameter pollution via function-call manipulation"
    description: >
      An attacker crafts input that causes the agent to invoke a tool with
      inflated, malformed, or boundary-violating parameter values. The tool
      executes within its granted permissions but produces an outcome far
      outside intended operational bounds, such as amplified quantities or
      modified recipients.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0006]
        abstract_action: >
          Study the agent's tool definitions and parameter schemas to
          identify validation gaps, boundary conditions, or parameters
          that accept open-ended values.
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft input designed to cause the agent to populate tool
          parameters with inflated, malformed, or boundary-violating
          values while staying within the tool's granted permissions.
      - step: deliver_payload
        tactic: AML.TA0004
        techniques: [AML.T0049, AML.T0093]
        abstract_action: >
          Submit the crafted input through an accessible channel
          (direct input or indirect via document/email).
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.000, AML.T0051.001]
        abstract_action: >
          The agent processes the input, and the prompt injection
          causes it to resolve attacker-influenced values into tool
          call parameter slots.
      - step: invoke_tool
        tactic: AML.TA0005
        techniques: [AML.T0053]
        abstract_action: >
          The agent invokes the tool with polluted parameters; the
          call passes permission checks because the tool itself is
          authorized, but parameter values produce an outcome far
          outside intended operational bounds.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The tool executes with attacker-influenced parameters,
          producing amplified quantities, modified recipients, or
          other outcomes that violate the system's operational intent.

  AP-T2-02:
    id: "AP-T2-02"
    threat_id: "T2"
    name: "Multi-tool chain exploitation for data exfiltration"
    description: >
      An attacker manipulates the agent into chaining two or more authorized
      tools in a sequence the system designer did not anticipate. One tool
      retrieves sensitive data while a subsequent tool transmits it to an
      external destination. Each individual tool call appears legitimate,
      making the composite attack difficult to detect.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0006]
        abstract_action: >
          Discover the agent's available tools and their call chain
          relationships, identifying combinations where one tool
          retrieves sensitive data and another can transmit externally.
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft a prompt that induces the agent to plan a multi-step
          tool sequence, framing the retrieval-then-exfiltration chain
          as a legitimate composite operation.
      - step: deliver_payload
        tactic: AML.TA0004
        techniques: [AML.T0049, AML.T0093]
        abstract_action: >
          Submit the crafted prompt through an accessible input
          channel.
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.000, AML.T0051.001]
        abstract_action: >
          The agent processes the prompt and commits to the
          multi-tool chain without recognizing the composite intent
          as malicious.
      - step: discover_data
        tactic: AML.TA0008
        techniques: [AML.T0075, AML.T0007]
        abstract_action: >
          The agent discovers or accesses the data sources containing
          sensitive information through the first tool in the chain.
      - step: collect_data
        tactic: AML.TA0009
        techniques: [AML.T0036, AML.T0085.001]
        abstract_action: >
          The first tool retrieves sensitive data from an authorized
          source, producing output that appears to be a normal
          intermediate result.
      - step: exfiltrate_data
        tactic: AML.TA0010
        techniques: [AML.T0086]
        abstract_action: >
          A subsequent tool call transmits the retrieved data to an
          external destination (attacker-controlled email, URL, API
          endpoint).
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Organization suffers data breach through a composite tool
          chain that bypasses per-call authorization controls.

  AP-T2-03:
    id: "AP-T2-03"
    threat_id: "T2"
    name: "Automated mass-action abuse via tool amplification"
    description: >
      An attacker tricks the agent into using its document generation,
      distribution, or batch-processing tools to perform a high-volume
      malicious operation. The agent's automation capability amplifies a
      single deceptive input into a large-scale action such as mass
      distribution of crafted content.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: discover_tools
        tactic: AML.TA0008
        techniques: [AML.T0084.001]
        abstract_action: >
          Discover the agent's batch-processing, mass-distribution,
          or document-generation capabilities and their parameter
          schemas.
      - step: setup
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft a deceptive prompt that frames a high-volume malicious
          operation as a legitimate batch task, embedding parameters
          that maximize the agent's amplification factor.
      - step: execution
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Submit the crafted input, causing the agent to accept the
          mass-action parameters and begin planning the batch
          operation without recognizing its malicious scale.
      - step: amplification
        tactic: AML.TA0005
        techniques: [AML.T0053]
        abstract_action: >
          The agent invokes its batch-processing tools, amplifying
          the single deceptive input into a high-volume operation
          such as mass distribution of crafted content or bulk
          data modification.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          A single attacker input produces large-scale damage through
          the agent's automation capabilities, with impact
          disproportionate to the attacker's effort.

  AP-T2-04:
    id: "AP-T2-04"
    threat_id: "T2"
    name: "Tool misuse via poisoned persistent memory"
    description: >
      An attacker injects false directives into the agent's persistent memory
      in a prior session. In subsequent sessions the agent retrieves the
      poisoned memory and treats it as legitimate operational context, causing
      it to invoke tools with unauthorized parameters or targets while
      bypassing session-level security checks.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "memory", "tool_execution"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft adversarial prompt containing false directives designed
          to be written into the agent's persistent memory store.
      - step: conceal_injection
        tactic: AML.TA0007
        techniques: [AML.T0068]
        abstract_action: >
          Conceal the prompt injection within content that appears
          benign or legitimate (hidden in document formatting,
          embedded in innocuous text).
      - step: deliver_payload
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver the poisoned content through a channel the agent
          consumes as a trusted source (shared document, API response,
          data feed).
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          When the agent ingests the content into its context, the
          hidden prompt injection executes.
      - step: persist_in_memory
        tactic: AML.TA0006
        techniques: [AML.T0080.000]
        abstract_action: >
          The injection writes attacker-controlled false directives
          into the agent's persistent memory store, establishing
          cross-session persistence.
      - step: persist_in_channel
        tactic: AML.TA0006
        techniques: [AML.T0093]
        abstract_action: >
          The poisoned content remains in the shared channel or data
          source, acting as a persistent infection vector that can
          compromise additional users or sessions.
      - step: invoke_tool_from_memory
        tactic: AML.TA0005
        techniques: [AML.T0053, AML.T0051.002]
        abstract_action: >
          In a subsequent session, the agent retrieves the poisoned
          memory and treats it as legitimate operational context,
          causing it to invoke tools with unauthorized parameters or
          targets.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The agent performs tool invocations driven by
          attacker-controlled memory content, bypassing session-level
          security checks that would have caught the malicious
          directive if presented directly.

  AP-T2-05:
    id: "AP-T2-05"
    threat_id: "T2"
    name: "Tool misuse via adversarial retrieval content"
    description: >
      An attacker inserts adversarially crafted content into a vector store
      that the agent queries for context. When the agent retrieves this
      poisoned content, it interprets the embedded directives as legitimate
      operational guidance, leading to unsafe or unauthorized tool invocations
      driven by the manipulated retrieval results.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "memory", "tool_execution"]
      kc_requires:
        all: [KCX-VSTORE]
        any: [KC6.3.3]
    kill_chain:
      - step: gain_access
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Gain access to the vector store or RAG system that the
          agent queries (either through write access or by injecting
          content into a data source the system indexes).
      - step: craft_adversarial_content
        tactic: AML.TA0003
        techniques: [AML.T0066, AML.T0065]
        abstract_action: >
          Craft adversarial content with embedded directives designed
          to manipulate the agent's tool invocation decisions when
          retrieved from the vector store.
      - step: inject_content
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Craft and insert adversarial content into the vector store;
          the content contains embedded directives designed to
          manipulate the agent's tool invocation decisions.
      - step: persist_in_retrieval
        tactic: AML.TA0006
        techniques: [AML.T0070]
        abstract_action: >
          The poisoned content is indexed and persists in the
          retrieval system, where it can be activated by future
          queries.
      - step: trigger_tool_invocation
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0053]
        abstract_action: >
          When the agent queries the RAG system, it retrieves the
          poisoned content and invokes tools based on the manipulated
          directives, executing unsafe or unauthorized operations.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The agent performs unauthorized tool actions driven by
          poisoned retrieval content, with each query to the
          compromised vector store potentially triggering malicious
          behavior.

  AP-T2-06:
    id: "AP-T2-06"
    threat_id: "T2"
    name: "Tool hijacking via prompt injection"
    description: >
      An attacker injects adversarial instructions into user input or an
      external data source consumed by the agent. The injected prompt
      overrides or supplements the agent's goal, causing it to invoke a
      tool — such as a shell, API client, or code interpreter — to execute
      a command chosen by the attacker.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]
    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0006]
        abstract_action: >
          Study the agent's interaction model and tool access to
          understand which tools can execute attacker commands (shell,
          code interpreter, API client, file operations).
      - step: gain_access
        tactic: AML.TA0000
        techniques: [AML.T0047, AML.T0040]
        abstract_action: >
          Gain ability to interact with the agent's LLM, either
          directly or through data sources it consumes.
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0079]
        abstract_action: >
          Craft adversarial instructions designed to override the
          agent's operational goal and direct it to invoke a specific
          tool with attacker-chosen commands; stage any required
          external payloads or receiving infrastructure.
      - step: verify_attack
        tactic: AML.TA0001
        techniques: [AML.T0042]
        abstract_action: >
          Verify that the prompt injection is effective and the tool
          invocation will execute attacker commands (through benign
          test payloads before escalating to malicious ones).
      - step: deliver_injection
        tactic: AML.TA0004
        techniques: [AML.T0049, AML.T0093]
        abstract_action: >
          Inject the crafted prompt into the agent's input channel or
          embed it within an external data source the agent consumes
          (document, web page, API response, email).
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.000, AML.T0051.001]
        abstract_action: >
          The injected prompt activates within the agent's context,
          overriding or supplementing its original goal with the
          attacker's directive to invoke a tool.
      - step: invoke_tool
        tactic: AML.TA0005
        techniques: [AML.T0053, AML.T0050]
        abstract_action: >
          The agent invokes a tool — such as a shell, API client,
          or code interpreter — executing an attacker-chosen command
          through the agent's legitimate tool access.
      - step: harvest_credentials
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0083]
        abstract_action: >
          If the goal is credential theft, the tool execution accesses
          environment variables, configuration files, or memory to
          extract secrets.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0112, AML.T0048]
        abstract_action: >
          The attacker achieves arbitrary tool execution through the
          hijacked agent, potentially gaining host-level access,
          exfiltrating data, or performing destructive actions.

  # ═══════════════════════════════════════════════════════════════════
  # T3 — Privilege Compromise (3 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T3-01:
    id: "AP-T3-01"
    threat_id: "T3"
    name: "Temporary privilege retention via misconfiguration exploitation"
    description: >
      An attacker manipulates the agent into requesting temporary elevated
      privileges under a legitimate pretext. The agent then exploits a
      misconfiguration in the permission lifecycle to retain those privileges
      beyond their intended scope, enabling persistent unauthorized access
      to sensitive resources.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        all: [KCX-PRIV]
        any: [KC6.1.2, KC6.2.2, KC6.3.2, KC6.5]

  AP-T3-02:
    id: "AP-T3-02"
    threat_id: "T3"
    name: "Cross-boundary authorization escalation"
    description: >
      An attacker leverages the agent's authorized access to one system to
      escalate privileges in a connected system that lacks independent scope
      enforcement. The agent's credentials or trust relationships carry over
      across system boundaries, granting access to resources beyond the
      agent's intended authorization domain.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.2, KC6.2.2, KC6.5, KCX-XAUTH]
    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0006, AML.T0003]
        abstract_action: >
          Identify agent's connected systems and trust boundaries
          where authorization scope is not independently enforced.
      - step: probe_trust_boundaries
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Interact with agent in source system to probe trust
          relationships and cross-system capabilities.
      - step: discover_connected_services
        tactic: AML.TA0008
        techniques: [AML.T0084.001, AML.T0075]
        abstract_action: >
          Discover agent's plugins, APIs, and connected services
          that span trust boundaries.
      - step: craft_cross_boundary_request
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft request leveraging agent's legitimate access in
          source system to target connected system.
      - step: deliver_request
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Deliver crafted request causing agent to authenticate to
          target system using inherited credentials.
      - step: obfuscate_request
        tactic: AML.TA0007
        techniques: [AML.T0068, AML.T0074]
        abstract_action: >
          Obfuscate cross-boundary request to evade detection in
          source system.
      - step: persist_in_knowledge_store
        tactic: AML.TA0006
        techniques: [AML.T0070, AML.T0080.000]
        abstract_action: >
          Poisoned data persists in agent's knowledge store,
          re-triggering cross-boundary escalation.
      - step: execute_request
        tactic: AML.TA0005
        techniques: [AML.T0051.000, AML.T0053]
        abstract_action: >
          Agent processes request, inheriting authorization from
          source system.
      - step: escalate_privileges
        tactic: AML.TA0012
        techniques: [AML.T0012]
        abstract_action: >
          Agent's credentials from source system grant elevated
          access in target system lacking scope enforcement.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Unauthorized access to resources beyond agent's intended
          authorization domain.

  AP-T3-03:
    id: "AP-T3-03"
    threat_id: "T3"
    name: "Shadow agent credential inheritance"
    description: >
      An attacker exploits weak provisioning controls to instantiate an
      unauthorized agent that inherits or copies legitimate credentials from
      the hosting environment. The shadow agent operates alongside authorized
      agents, using inherited permissions to perform actions while evading
      detection through its apparent legitimacy.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution", "inter_agent"]
      kc_requires:
        all: [KC2.3, KCX-MAGENT]
        any: [KC5.1, KC5.2, KC5.3, KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7, KCX-XAUTH]

  # ═══════════════════════════════════════════════════════════════════
  # T4 — Resource Overload (4 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T4-01:
    id: "AP-T4-01"
    threat_id: "T4"
    name: "Computationally expensive input exploitation"
    description: >
      An attacker submits specially crafted inputs that force the agent into
      resource-intensive processing paths — such as deeply nested reasoning,
      complex parsing, or exhaustive search. The disproportionate compute
      cost per request degrades throughput and delays time-sensitive operations.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC6.1.2, KC6.2.2, KC6.6, KC6.7]

  AP-T4-02:
    id: "AP-T4-02"
    threat_id: "T4"
    name: "Multi-agent concurrent resource exhaustion"
    description: >
      An attacker triggers multiple agents to perform resource-intensive
      tasks simultaneously, either by exploiting fan-out mechanisms or by
      sending parallel requests. The aggregate computational demand exceeds
      system capacity, degrading service quality across all agents and
      operations.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T4-03:
    id: "AP-T4-03"
    threat_id: "T4"
    name: "External API quota exhaustion"
    description: >
      An attacker crafts requests that cause the agent to make excessive
      calls to rate-limited or quota-bound external APIs. The rapid
      consumption of API quotas blocks legitimate operations that depend
      on those external services, creating a denial-of-service condition
      without directly attacking the agent's infrastructure.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2, KC6.4, KC6.5, KC6.6, KC6.7]

  AP-T4-04:
    id: "AP-T4-04"
    threat_id: "T4"
    name: "Memory allocation cascade failure"
    description: >
      An attacker initiates multiple concurrent tasks that each require
      substantial memory allocation. The cumulative demand causes memory
      fragmentation and leaks, leading to cascading failures as the system
      exhausts available memory and cannot service new or existing requests.
    nist_classification:
      attacker_goal: "availability"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC6.1.2, KC6.2.2, KC6.6, KC6.7]
