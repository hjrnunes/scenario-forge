          security_relevant: true
          terminal: false
        order: 2
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          - reference_type: design_record
            reference_id: review-t1-t5.md
          confidence: 70
          adaptation_rationale: 'Adapted from the AML.CS0040 scaffold: direct submission of crafted fragments
            over successive turns; strictly within-session, all persistence wording removed per review-t1-t5.md.'
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: The crafted direct-prompting identity of the whole operation is carried at chain
            level (AML.T0051.000); the lineage asserts no exact step-level identity for fragment delivery.
      - step_id: execute_fragments
        requirement: required
        condition: null
        executor_role: attacker
        boundary_position: inside
        action_kind: invoke
        consumed:
        - kind: state
          ref_id: session.fragment.stream
          value_type: object
        produced:
