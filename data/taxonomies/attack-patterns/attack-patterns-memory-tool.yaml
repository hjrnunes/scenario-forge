          description: Each fragment executes, consuming context-window capacity and incrementally eroding
            authorization-state tracking.
          security_relevant: true
          terminal: false
        order: 3
        attacker_controlled: true
        provenance:
          tier: variant
          references:
          - reference_type: catalog
            reference_id: AML.CS0040
          - reference_type: design_record
            reference_id: review-t1-t5.md
          confidence: 70
          adaptation_rationale: 'Adapted from the AML.CS0040 scaffold: cumulative within-session context
            saturation; no cross-session accumulation (that is AP-T1-01''s mechanism).'
        mappings:
        - decision: unmapped
          taxonomy: ATLAS
          rationale: Chain-level AML.T0051.000 covers the direct crafted prompting; the lineage asserts
            no separate step-level identity for fragment execution.
      - step_id: escalate_privileges
