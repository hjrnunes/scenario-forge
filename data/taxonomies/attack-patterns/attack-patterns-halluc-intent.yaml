# Abstract attack patterns for scenario-forge (Batch B: T5/T6/T11/T13).
# Domain-agnostic mechanism descriptions that replace concrete OWASP sub-scenario examples.
# Each pattern is derived from an OWASP sub-scenario but strips domain-specific details,
# describing the attack mechanism rather than a specific target application.

source:
  name: "scenario-forge abstract attack patterns"
  version: "0.1.0"
  derived_from:
    - "OWASP Agentic AI Threats & Mitigations v1.1"
    - "NIST AI 100-2e2023"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # T5 — Cascading Hallucination Attacks (4 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T5-01:
    id: "AP-T5-01"
    threat_id: "T5"
    name: "Progressive misinformation accumulation in persistent memory"
    description: >
      An attacker injects subtly false information into an agent's responses,
      which the agent then stores in its long-term memory. Over successive
      interactions the fabricated data compounds, producing progressively
      more distorted outputs as the agent treats its own prior hallucinations
      as authoritative source material.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.integrity_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: craft_false_information
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft subtly false information designed to be stored as
          agent's authoritative memory.
      - step: conceal_payload
        tactic: AML.TA0007
        techniques: [AML.T0068, AML.T0074]
        abstract_action: >
          Conceal fabricated data within legitimate-appearing content
          to avoid detection.
      - step: deliver_via_trusted_channel
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver content containing false information via trusted
          channel.
      - step: execute_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Agent ingests content, false information is processed and
          stored in persistent memory.
      - step: establish_memory_persistence
        tactic: AML.TA0006
        techniques: [AML.T0080.000]
        abstract_action: >
          False information persists in long-term memory, treated as
          authoritative source material in subsequent sessions.
      - step: compound_distortion
        tactic: AML.TA0011
        techniques: [AML.T0031]
        abstract_action: >
          Progressive compounding produces increasingly distorted
          outputs as agent builds on prior hallucinations.

  AP-T5-02:
    id: "AP-T5-02"
    threat_id: "T5"
    name: "Hallucinated endpoint injection for data exfiltration"
    description: >
      An attacker introduces references to fictitious external endpoints
      into the agent's context. The agent, unable to distinguish the
      fabricated endpoints from legitimate ones, generates calls to
      attacker-controlled services, leaking sensitive data from its
      operational context in the process.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.integrity_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: develop_endpoint_injection
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Develop prompt injection causing agent to include fabricated
          endpoint references in generated output.
      - step: stage_injection_content
        tactic: AML.TA0003
        techniques: [AML.T0066, AML.T0079]
        abstract_action: >
          Stage prompt injection in content accessible to agent
          (webpage, document, knowledge base).
      - step: trigger_retrieval
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          User query causes agent to retrieve content containing
          injection.
      - step: activate_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0053]
        abstract_action: >
          Injection activates, causing agent to generate calls to
          fabricated API endpoints or webhook URLs.
      - step: exfiltrate_via_endpoints
        tactic: AML.TA0010
        techniques: [AML.T0086]
        abstract_action: >
          Agent invokes hallucinated endpoints with user data encoded
          in URL parameters or request body.
      - step: data_exfiltration_impact
        tactic: AML.TA0011
        techniques: [AML.T0048.000, AML.T0048.003]
        abstract_action: >
          Confidential data exfiltrated to attacker-controlled
          endpoint through hallucinated API calls.

  AP-T5-03:
    id: "AP-T5-03"
    threat_id: "T5"
    name: "Self-reinforcing hallucination amplification in decision chains"
    description: >
      An attacker plants a false factual claim into an agent's reasoning
      context. As the agent builds subsequent decisions on top of the
      fabricated premise, each reasoning step amplifies the original
      hallucination, producing increasingly dangerous recommendations
      that compound through the decision chain.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.integrity_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]

  AP-T5-04:
    id: "AP-T5-04"
    threat_id: "T5"
    name: "Fabricated reference data injection for value manipulation"
    description: >
      An attacker injects false quantitative reference data into an agent's
      context, causing the agent to negotiate, transact, or make decisions
      based on unrealistic values. The hallucinated data persists across
      interactions, systematically biasing all downstream computations that
      depend on the corrupted reference values.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.integrity_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]
    kill_chain:
      - step: identify_data_corpus
        tactic: AML.TA0002
        techniques: [AML.T0064, AML.T0003]
        abstract_action: >
          Identify agent's data corpus and query patterns to target
          value-dependent decisions.
      - step: probe_retrieval_mechanisms
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Interact with agent to discover retrieval mechanisms and
          response format.
      - step: discover_value_handling
        tactic: AML.TA0008
        techniques: [AML.T0063, AML.T0084.001]
        abstract_action: >
          Probe agent to identify how it handles quantitative
          reference data and value lookups.
      - step: craft_false_reference_data
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft false quantitative reference data targeting agent's
          value-dependent decision processes.
      - step: deliver_fabricated_values
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver content containing fabricated values through
          channel feeding agent's data corpus.
      - step: obfuscate_injection
        tactic: AML.TA0007
        techniques: [AML.T0068, AML.T0071]
        abstract_action: >
          Obfuscate injection and manipulate retrieval to prioritize
          attacker-controlled data.
      - step: persist_in_rag
        tactic: AML.TA0006
        techniques: [AML.T0070]
        abstract_action: >
          False reference data indexed into RAG database, persisting
          across sessions.
      - step: activate_via_retrieval
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          User query triggers retrieval and prompt injection
          activates.
      - step: manipulate_tool_invocations
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          Injection manipulates agent's tool invocations or
          authorization decisions using fabricated values.
      - step: value_biased_decisions
        tactic: AML.TA0011
        techniques: [AML.T0048.000, AML.T0031]
        abstract_action: >
          Agent negotiates, transacts, or decides based on
          unrealistic values, systematically biasing computations.

  # ═══════════════════════════════════════════════════════════════════
  # T6 — Intent Breaking & Goal Manipulation (5 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T6-01:
    id: "AP-T6-01"
    threat_id: "T6"
    name: "Incremental sub-goal injection for plan drift"
    description: >
      An attacker incrementally injects auxiliary sub-goals into the agent's
      planning framework over multiple interactions. Each injected sub-goal
      appears benign in isolation, but their cumulative effect gradually
      shifts the agent's plan away from its original objective while
      maintaining the surface appearance of coherent reasoning.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.direct_prompt_injection.jailbreak"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    kill_chain:
      - step: discover_planning
        tactic: AML.TA0008
        techniques: [AML.T0084.001]
        abstract_action: >
          Probe the agent's planning interface to discover how it
          decomposes tasks into sub-goals and which goal-setting
          mechanisms are exposed to user input.
      - step: setup
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft a series of individually benign sub-goal injections,
          each designed to appear as a reasonable refinement of the
          agent's current objective.
      - step: delivery
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Submit the sub-goal injections incrementally across multiple
          interactions, each prompt nudging the agent's plan slightly
          toward the attacker's desired outcome.
      - step: evasion
        tactic: AML.TA0007
        techniques: [AML.T0067]
        abstract_action: >
          Each injected sub-goal maintains surface coherence with the
          agent's stated objective, manipulating the agent's output
          to present the drifted plan as logically sound.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The cumulative drift redirects the agent's plan to serve
          attacker objectives while the agent continues to present
          its reasoning as aligned with the original user goal.

  AP-T6-02:
    id: "AP-T6-02"
    threat_id: "T6"
    name: "Direct instruction override for tool-chain hijacking"
    description: >
      An attacker issues an explicit instruction that commands the agent
      to discard its original directives and instead execute an attacker-
      specified sequence of tool invocations. The agent's lack of robust
      instruction-data separation causes it to treat the injected command
      as authoritative, executing unauthorized action chains.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.direct_prompt_injection.jailbreak"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    kill_chain:
      - step: research_injection_patterns
        tactic: AML.TA0002
        techniques: [AML.T0001, AML.T0004]
        abstract_action: >
          Familiarize with typical prompt injection patterns and
          understand agent's code execution pathway.
      - step: access_agent_interface
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Gain access to the agent's public interface to test prompt
          injection feasibility.
      - step: test_prompt_injections
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Test crafted prompt injections to probe which directives
          the agent will follow and how it handles code generation
          requests.
      - step: validate_exploit_reliability
        tactic: AML.TA0001
        techniques: [AML.T0042, AML.T0102]
        abstract_action: >
          Validate that malicious prompts reliably produce
          unauthorized code execution with benign test payloads.
      - step: deliver_refined_injection
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Deliver the refined prompt injection through the agent's
          input channel.
      - step: execute_code_via_interpreter
        tactic: AML.TA0005
        techniques: [AML.T0051.000, AML.T0050, AML.T0053]
        abstract_action: >
          Agent processes the injection and executes attacker-chosen
          commands through its code interpreter or tool execution
          capability.
      - step: exfiltrate_credentials
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0083]
        abstract_action: >
          Exfiltrate environment variables and API keys through the
          hijacked code execution.
      - step: system_compromise
        tactic: AML.TA0011
        techniques: [AML.T0029, AML.T0112]
        abstract_action: >
          Achieve system compromise through denial of service or
          credential theft.

  AP-T6-03:
    id: "AP-T6-03"
    threat_id: "T6"
    name: "Indirect goal redirection via poisoned tool output"
    description: >
      A compromised or malicious data source returns output containing
      hidden instructions that the agent misinterprets as part of its
      operational goal. The agent incorporates the injected objective
      into its plan without recognizing the boundary between data and
      instruction, leading to unintended actions such as data exfiltration.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    kill_chain:
      - step: craft_poisoned_content
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066]
        abstract_action: >
          Craft malicious web content or data source containing
          hidden prompt injection instructions.
      - step: conceal_injection
        tactic: AML.TA0007
        techniques: [AML.T0068, AML.T0074]
        abstract_action: >
          Conceal the injection within seemingly legitimate content
          that evades initial scrutiny.
      - step: fetch_poisoned_content
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Agent fetches poisoned content from the compromised data
          source, ingesting it into its context.
      - step: redirect_agent_goal
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          Injection redirects agent's goal, treating attacker
          instructions as operational objectives.
      - step: execute_unintended_actions
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Agent performs unintended actions such as data exfiltration
          based on the injected goal.

  AP-T6-04:
    id: "AP-T6-04"
    threat_id: "T6"
    name: "Reflection loop resource exhaustion trap"
    description: >
      An attacker crafts input that triggers the agent's self-evaluation
      or reflection mechanism into an unbounded loop. The agent repeatedly
      re-analyzes its own output, consuming computational resources and
      preventing it from completing real-time tasks, effectively creating
      a denial-of-service condition through the agent's own reasoning process.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.direct_prompt_injection.jailbreak"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0008
        techniques: [AML.T0084.002]
        abstract_action: >
          Discover that the agent employs a self-evaluation or
          reflection mechanism that re-analyzes its own output
          before finalizing responses.
      - step: setup
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft input designed to trigger the agent's reflection
          loop into an unbounded cycle, such as self-contradictory
          requirements that prevent convergence.
      - step: delivery
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Submit the crafted input to the agent, activating its
          self-evaluation mechanism with conditions that prevent
          the loop from terminating.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          The agent consumes computational resources in an unbounded
          reflection loop, creating a denial-of-service condition
          that prevents it from completing legitimate tasks.

  AP-T6-05:
    id: "AP-T6-05"
    threat_id: "T6"
    name: "Self-improvement mechanism corruption"
    description: >
      An attacker manipulates the agent's meta-learning or self-improvement
      mechanisms by introducing adversarial feedback patterns. The agent's
      adaptation process incorporates the malicious patterns, progressively
      degrading its decision-making integrity as it optimizes toward
      attacker-influenced objectives across successive learning cycles.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning"]
      kc_requires:
        any: [KC1.1, KC1.2, KC1.3, KC1.4]
    kill_chain:
      - step: access_learning_interface
        tactic: AML.TA0000
        techniques: [AML.T0047]
        abstract_action: >
          Gain access to the agent's learning interface (feedback
          channel, conversation API, or other adaptation mechanism).
      - step: deliver_adversarial_feedback
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Begin delivering adversarial feedback patterns designed to
          corrupt the agent's learning process.
      - step: corrupt_learned_behavior
        tactic: AML.TA0006
        techniques: [AML.T0020, AML.T0080.000]
        abstract_action: >
          Malicious patterns are incorporated into the agent's learned
          behavior, persisting across interactions.
      - step: degrade_decision_integrity
        tactic: AML.TA0011
        techniques: [AML.T0031]
        abstract_action: >
          Agent's decision-making integrity progressively degrades as
          it optimizes toward attacker-influenced objectives.

  # ═══════════════════════════════════════════════════════════════════
  # T11 — Unexpected RCE and Code Attacks (3 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T11-01:
    id: "AP-T11-01"
    threat_id: "T11"
    name: "Infrastructure-as-code injection via agent code generation"
    description: >
      An attacker manipulates an agent with code-generation capabilities
      into producing infrastructure configuration scripts that contain
      embedded malicious commands. The generated code passes superficial
      review because the harmful payloads are concealed within legitimate-
      looking configuration directives, enabling secret extraction or
      security control disablement upon execution.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.2.2]
    kill_chain:
      - step: analyze_framework_apis
        tactic: AML.TA0003
        techniques: [AML.T0017.000]
        abstract_action: >
          Perform static analysis on LLM framework APIs to identify
          code execution sinks (eval, exec).
      - step: scan_deployment_targets
        tactic: AML.TA0002
        techniques: [AML.T0004, AML.T0095.000]
        abstract_action: >
          Scan source code repositories for app deployment URLs that
          use vulnerable frameworks.
      - step: extract_call_chains
        tactic: AML.TA0008
        techniques: [AML.T0084.003]
        abstract_action: >
          Extract call chains from target application source code to
          identify paths leading to code execution.
      - step: develop_exploit_prompts
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Develop prompts designed to trigger tool invocations that
          flow attacker-controlled data into execution sinks.
      - step: access_public_application
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Access public-facing AI agent application through its user
          interface or API.
      - step: submit_crafted_prompt
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Submit crafted prompt to agent, causing it to process
          attacker instructions.
      - step: bypass_guardrails
        tactic: AML.TA0007
        techniques: [AML.T0054]
        abstract_action: >
          Use lightweight jailbreaking techniques to bypass LLM
          guardrails that refuse malicious requests.
      - step: invoke_tools_with_attacker_args
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          Agent invokes tools with attacker-controlled arguments,
          passing data into code execution call chain.
      - step: execute_code_in_interpreter
        tactic: AML.TA0005
        techniques: [AML.T0050]
        abstract_action: >
          Attacker's input evaluated as code within framework's
          sandboxed interpreter (e.g., Python eval).
      - step: escape_sandbox
        tactic: AML.TA0012
        techniques: [AML.T0105]
        abstract_action: >
          Execute sandbox escape techniques to break out of
          containerized or virtualized environment.
      - step: establish_reverse_shell
        tactic: AML.TA0014
        techniques: [AML.T0072]
        abstract_action: >
          Open reverse shell to establish persistent command channel
          to attacker infrastructure.
      - step: achieve_system_control
        tactic: AML.TA0011
        techniques: [AML.T0112, AML.T0112.000]
        abstract_action: >
          Achieve full system control; compromise host running the
          AI agent framework.
    evidence:
      - source: "AML.CS0052"
        type: "enrichment"

  AP-T11-02:
    id: "AP-T11-02"
    threat_id: "T11"
    name: "Workflow automation backdoor insertion"
    description: >
      An agent responsible for generating or modifying automation workflows
      is manipulated into embedding backdoor logic within the generated
      scripts. The backdoor persists across workflow executions, bypassing
      security validation checks that inspect only the declared workflow
      structure rather than the full executable content.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.2.2]
    kill_chain:
      - step: develop_backdoor_prompt
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Develop prompt instructing agent to embed backdoor logic
          in generated workflow scripts.
      - step: obtain_credentials
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0083]
        abstract_action: >
          Obtain access to workflow generation system's credentials
          or publishing mechanism.
      - step: inject_malicious_configuration
        tactic: AML.TA0004
        techniques: [AML.T0010.001, AML.T0012]
        abstract_action: >
          Use compromised credentials to inject malicious workflow
          configuration into deployment pipeline.
      - step: initialize_poisoned_agent
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Agent initializes with poisoned configuration or prompt
          injection.
      - step: generate_backdoor_scripts
        tactic: AML.TA0005
        techniques: [AML.T0050, AML.T0053]
        abstract_action: >
          Agent generates workflow scripts embedding
          attacker-specified destructive commands.
      - step: execute_unauthorized_actions
        tactic: AML.TA0011
        techniques: [AML.T0048, AML.T0101]
        abstract_action: >
          Generated workflows execute with agent's privileges,
          performing unauthorized actions.
    evidence:
      - source: "AML.CS0047"
        type: "enrichment"

  AP-T11-03:
    id: "AP-T11-03"
    threat_id: "T11"
    name: "Linguistic ambiguity exploitation for command injection"
    description: >
      An attacker crafts natural-language input containing deliberate
      ambiguities that the agent resolves into executable commands with
      unintended semantics. The gap between the agent's language
      interpretation and the execution environment's command parsing
      creates an injection vector that bypasses intent-based security
      filters operating at the natural-language layer.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.2.2, KC6.4]
    kill_chain:
      - step: identify_target_systems
        tactic: AML.TA0002
        techniques: [AML.T0004, AML.T0006]
        abstract_action: >
          Identify AI agent systems that translate natural-language
          input into executable commands and their parsing behavior.
      - step: craft_ambiguous_input
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft natural-language input with deliberate ambiguities that
          resolve into unintended executable commands.
      - step: submit_ambiguous_input
        tactic: AML.TA0004
        techniques: [AML.T0049]
        abstract_action: >
          Submit ambiguous natural-language input through agent's public
          interface.
      - step: resolve_ambiguity_to_commands
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Agent resolves linguistic ambiguity into command structure,
          misinterpreting attacker intent as legitimate.
      - step: invoke_tools_with_derived_params
        tactic: AML.TA0012
        techniques: [AML.T0053]
        abstract_action: >
          Agent invokes tools with parameters derived from ambiguous
          interpretation, escalating to code execution.
      - step: parse_output_as_code
        tactic: AML.TA0005
        techniques: [AML.T0050]
        abstract_action: >
          Execution environment parses agent's output as code, bridging
          semantic gap between NL and command layer.
      - step: execute_unintended_command
        tactic: AML.TA0011
        techniques: [AML.T0112, AML.T0048]
        abstract_action: >
          Unintended command executes with agent's privileges, achieving
          attacker objective.

  # ═══════════════════════════════════════════════════════════════════
  # T13 — Rogue Agents in Multi-Agent Systems (4 patterns)
  # ═══════════════════════════════════════════════════════════════════

  AP-T13-01:
    id: "AP-T13-01"
    threat_id: "T13"
    name: "Trust-exploiting workflow injection by rogue agent"
    description: >
      A compromised or malicious agent exploits inter-agent trust
      mechanisms to inject unauthorized tasks into a multi-agent workflow.
      By impersonating a legitimate agent role, the rogue agent bypasses
      validation controls and inserts fraudulent operations that other
      agents process as authenticated workflow steps.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T13-02:
    id: "AP-T13-02"
    threat_id: "T13"
    name: "Orchestration hijacking via fragmented approval chains"
    description: >
      A rogue agent manipulates the orchestration layer of a multi-agent
      system by routing tasks through multiple lower-privilege agents in
      sequence. Each agent approves only its fragment of the request,
      and no single agent sees the full operation, allowing the rogue
      agent to assemble fragmented approvals into authorization for an
      action that would fail holistic validation.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T13-03:
    id: "AP-T13-03"
    threat_id: "T13"
    name: "Coordinated task flooding by colluding agents"
    description: >
      Multiple compromised agents simultaneously generate excessive task
      requests targeting shared computational resources. The coordinated
      flood overwhelms the system's scheduling and resource allocation
      mechanisms, degrading performance for legitimate agents and delaying
      time-sensitive decision-making processes.
    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]

  AP-T13-04:
    id: "AP-T13-04"
    threat_id: "T13"
    name: "Infectious reasoning-chain backdoor propagation"
    description: >
      A single compromised agent embeds malicious logic within its
      reasoning chain outputs. As other agents in the multi-agent system
      consume these outputs as inputs to their own reasoning, the
      backdoor logic silently propagates across the agent network,
      creating a self-spreading compromise that persists even if the
      original rogue agent is isolated.
    nist_classification:
      attacker_goal: "integrity"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "inter_agent"]
      kc_requires:
        all: [KCX-MAGENT]
        any: [KC2.3]
    kill_chain:
      - step: craft_self_propagating_payload
        tactic: AML.TA0003
        techniques: [AML.T0065]
        abstract_action: >
          Craft self-propagating prompt injection designed so that any
          agent processing it will include the payload in its own outputs.
      - step: inject_initial_payload
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0051.000]
        abstract_action: >
          Inject the self-propagating payload into a single agent's
          input or a shared data structure.
      - step: replicate_in_agent_outputs
        tactic: AML.TA0006
        techniques: [AML.T0061]
        abstract_action: >
          The infected agent's outputs contain the backdoor payload,
          which becomes input for peer agents through normal inter-agent
          communication.
      - step: propagate_to_peer_agents
        tactic: AML.TA0015
        techniques: [AML.T0052.000]
        abstract_action: >
          Peer agents process the infected output, incorporate the
          backdoor logic, and propagate it further through their own
          outputs.
      - step: achieve_system_wide_compromise
        tactic: AML.TA0011
        techniques: [AML.T0031, AML.T0048]
        abstract_action: >
          The backdoor spreads across the multi-agent system through
          normal communication, persisting even if the original
          infection point is removed.
