# Abstract attack patterns derived from MITRE ATLAS case studies.
# Each pattern is abstracted from a real-world incident using the
# Strip/Keep/Abstract/Add methodology (see staging/case-study-abstraction-strategy.md).
# Domain-agnostic mechanism descriptions — all case-study-specific details removed.

source:
  name: "scenario-forge abstract attack patterns (ATLAS-derived)"
  version: "0.1.0"
  derived_from:
    - "MITRE ATLAS v6 Case Studies (2024-2025)"
    - "OWASP Agentic AI Threats & Mitigations v1.1"

patterns:
  # ═══════════════════════════════════════════════════════════════════
  # AP-T6-06 — AI agent as persistent C2 implant (CS0051)
  # Unique kill chain (longest, 8 steps). Agent compromised through
  # prompt injection with control sequence spoofing, installed as C2
  # implant with persistence and lateral movement.
  # ═══════════════════════════════════════════════════════════════════

  AP-T6-06:
    id: "AP-T6-06"
    threat_id: "T6"
    name: "AI agent as persistent C2 implant via control sequence spoofing"
    description: >
      An attacker studies an AI agent's internal control sequences and
      crafts a prompt injection that spoofs the agent's own runtime
      delimiters to fabricate a fake interaction history showing user
      approval. When the agent fetches attacker-controlled content, the
      injection activates and instructs the agent to download a C2 polling
      script and modify a configuration file that is prepended to every
      future system prompt, establishing persistent command-and-control
      across all subsequent sessions.

    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution", "memory"]
      kc_requires:
        all: [KCX-PMEM]
        any: [KC6.1.1, KC6.1.2, KC6.4, KC6.5]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"

    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0004, AML.T0095.000]
        abstract_action: >
          Identify OpenClaw GitHub repository and familiarize with
          agent architecture.
      - step: acquire_configurations
        tactic: AML.TA0003
        techniques: [AML.T0002.002]
        abstract_action: >
          Acquire agent configurations and develop understanding of
          attack surface.
      - step: discover_control_sequences
        tactic: AML.TA0008
        techniques: [AML.T0069.000, AML.T0084]
        abstract_action: >
          Discover control sequences (`<think>`, `<user_feedback>`)
          and special delimiter characters used by the agent.
      - step: craft_injection
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0017.000]
        abstract_action: >
          Develop multi-stage prompt injection that spoofs internal
          control sequences to fabricate fake user approval.
      - step: stage_infrastructure
        tactic: AML.TA0003
        techniques: [AML.T0008.002, AML.T0079]
        abstract_action: >
          Acquire domain and stage C2 polling script on
          attacker-controlled infrastructure.
      - step: social_engineering_lure
        tactic: AML.TA0007
        techniques: [AML.T0074]
        abstract_action: >
          Victim confuses attacker's domain with official domain;
          attacker uses social engineering to lure victim.
      - step: initial_access
        tactic: AML.TA0004
        techniques: [AML.T0078]
        abstract_action: >
          Victim asks agent to summarize attacker's malicious website,
          pulling malicious content into agent's context.
      - step: injection_activation
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0050]
        abstract_action: >
          Prompt injection embedded in website executes, causing agent
          to download and run C2 polling script.
      - step: control_sequence_spoofing
        tactic: AML.TA0007
        techniques: [AML.T0054]
        abstract_action: >
          Attacker uses `<think>` control sequences to spoof internal
          reasoning and bypass safety alignment.
      - step: script_execution
        tactic: AML.TA0005
        techniques: [AML.T0050, AML.T0053]
        abstract_action: >
          Agent invokes bash to retrieve and execute malicious script
          under spoofed authorization.
      - step: config_modification
        tactic: AML.TA0006
        techniques: [AML.T0081]
        abstract_action: >
          Script modifies agent configuration file to inject C2
          polling instructions into all future system prompts.
      - step: poisoned_prompt_activation
        tactic: AML.TA0005
        techniques: [AML.T0051.002]
        abstract_action: >
          Modified system prompt loads on new agent threads, activating
          the injected C2 polling instructions.
      - step: propagation
        tactic: AML.TA0006
        techniques: [AML.T0080.001, AML.T0061]
        abstract_action: >
          All new threads inherit the poisoned system prompt,
          propagating the compromise to every future interaction.
      - step: c2_activation
        tactic: AML.TA0014
        techniques: [AML.T0108]
        abstract_action: >
          Compromised agent acts as C2 agent, fetching and executing
          attacker commands on trigger.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0112, AML.T0112.000]
        abstract_action: >
          Agent's behavior is permanently hijacked; all new threads
          poisoned; agent can no longer be trusted.

    evidence:
      - source: "AML.CS0051"
        type: "direct_demonstration"

  # ═══════════════════════════════════════════════════════════════════
  # AP-T11-05 — Computer-use agent exploitation via adversarial web
  # content (CS0055). Alpha template. Adversarial web content triggers
  # computer-use agent to execute attacker actions.
  # ═══════════════════════════════════════════════════════════════════

  AP-T11-05:
    id: "AP-T11-05"
    threat_id: "T11"
    name: "Computer-use agent exploitation via adversarial web content"
    description: >
      An attacker crafts web content containing elements designed to
      attract and manipulate a computer-use AI agent. The content
      includes agent-targeted clickbait that triggers interaction,
      client-side scripts that load malicious commands into the
      clipboard, and embedded instructions that direct the agent to
      open a terminal and execute the clipboard contents. The agent's
      ability to control keyboard, mouse, and clipboard bridges the
      gap from web content to arbitrary code execution on the host.

    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.4, KC6.5]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"

    kill_chain:
      - step: obtain_llm_access
        tactic: AML.TA0003
        techniques: [AML.T0016.002]
        abstract_action: >
          Obtain access to LLM service (e.g., ChatGPT) for
          generating attack content.
      - step: generate_adversarial_content
        tactic: AML.TA0003
        techniques: [AML.T0017.000]
        abstract_action: >
          Use LLM to generate adversarial web content with
          agent-targeted interactive elements and malicious scripts.
      - step: stage_infrastructure
        tactic: AML.TA0003
        techniques: [AML.T0079, AML.T0008.002]
        abstract_action: >
          Stage malicious website and payload script on
          attacker-controlled infrastructure.
      - step: delivery
        tactic: AML.TA0004
        techniques: [AML.T0078]
        abstract_action: >
          Computer-use agent navigates to or is directed to
          adversarial website, ingesting content into context.
      - step: engagement
        tactic: AML.TA0005
        techniques: [AML.T0100]
        abstract_action: >
          Agent-targeted clickbait (e.g., "Are you a computer?")
          causes agent to interact with page elements.
      - step: gui_action_injection
        tactic: AML.TA0005
        techniques: [AML.T0051.001, AML.T0050]
        abstract_action: >
          Embedded instructions direct agent to perform GUI action
          sequence: open terminal, paste clipboard, execute.
      - step: host_execution
        tactic: AML.TA0012
        techniques: [AML.T0053, AML.T0105]
        abstract_action: >
          Agent uses computer-use capabilities to execute attacker's
          command on host via keyboard/mouse/clipboard control.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0112, AML.T0112.000]
        abstract_action: >
          Arbitrary code executes on host with agent's privileges,
          achieving machine compromise.

    evidence:
      - source: "AML.CS0055"
        type: "direct_demonstration"

  # ═══════════════════════════════════════════════════════════════════
  # AP-T17-03 — MCP tool supply chain poisoning via namesquatting
  # (CS0053). Beta template. MCP tool registry namesquatting to get
  # malicious tool installed and exfiltrate data.
  # ═══════════════════════════════════════════════════════════════════

  AP-T17-03:
    id: "AP-T17-03"
    threat_id: "T17"
    name: "Tool supply chain poisoning via registry namesquatting"
    description: >
      An attacker registers a package name on a public tool registry
      before the legitimate maintainer claims it, then publishes a
      functional tool to build trust and adoption. After sufficient
      user base, the attacker publishes a malicious update that adds
      a covert exfiltration side-channel to the tool's normal operation.
      Users receive the poisoned version through routine dependency
      updates, and every subsequent tool invocation silently leaks data
      to the attacker.

    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.3.1, KC6.3.2]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"

    kill_chain:
      - step: namesquatting
        tactic: AML.TA0007
        techniques: [AML.T0073, AML.T0074]
        abstract_action: >
          Register package name on public registry before legitimate
          maintainer claims it (namesquatting).
      - step: develop_poisoned_tool
        tactic: AML.TA0003
        techniques: [AML.T0017]
        abstract_action: >
          Develop functional tool implementation with embedded
          malicious side-channel for data exfiltration.
      - step: publish_poisoned_tool
        tactic: AML.TA0003
        techniques: [AML.T0104]
        abstract_action: >
          Publish malicious version to package registry, embedding
          exfiltration logic in normal tool operation.
      - step: rug_pull_timing
        tactic: AML.TA0007
        techniques: [AML.T0109, AML.T0111]
        abstract_action: >
          Wait for user adoption before activating malicious behavior
          to evade initial scrutiny of new packages.
      - step: supply_chain_distribution
        tactic: AML.TA0004
        techniques: [AML.T0010, AML.T0010.005]
        abstract_action: >
          Users download and install poisoned tool through normal
          dependency management and supply chain.
      - step: persistence
        tactic: AML.TA0006
        techniques: [AML.T0110]
        abstract_action: >
          Poisoned tool persists in agent configurations as trusted
          dependency until explicitly detected and removed.
      - step: tool_invocation
        tactic: AML.TA0005
        techniques: [AML.T0011.002]
        abstract_action: >
          User instructs agent to invoke poisoned tool for
          legitimate operation.
      - step: exfiltration
        tactic: AML.TA0010
        techniques: [AML.T0086]
        abstract_action: >
          Tool performs normal function but silently exfiltrates data
          through embedded side-channel with each invocation.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Sensitive data continuously leaked to attacker through
          tool's covert channel piggybacking on legitimate use.

    evidence:
      - source: "AML.CS0053"
        type: "direct_demonstration"

  # ═══════════════════════════════════════════════════════════════════
  # AP-T1-06 — Zero-click RAG poisoning with rendered-output
  # exfiltration (CS0059). Unique kill chain. RAG poisoning that
  # exfils data through rendered output (markdown images, links).
  # ═══════════════════════════════════════════════════════════════════

  AP-T1-06:
    id: "AP-T1-06"
    threat_id: "T1"
    name: "Zero-click RAG poisoning with rendered-output exfiltration"
    description: >
      An attacker delivers content disguised as legitimate business
      material into a data corpus that feeds an AI assistant's RAG
      pipeline. When a user's query triggers retrieval of the poisoned
      content, hidden instructions activate without any direct user
      interaction with the malicious content. The injection instructs
      the AI to search for sensitive data and encode it into rendered
      output elements (such as markdown image URLs) that the client
      application automatically fetches, exfiltrating data to an
      attacker-controlled endpoint without user awareness.

    prerequisite_capabilities:
      min_zones: ["input", "reasoning", "memory"]
      kc_requires:
        all: [KCX-VSTORE]
        any: [KC4.3, KC4.4, KC4.5, KC4.6]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "black_box"
      learning_stage: "deployment"
      attack_class: "genai.indirect_prompt_injection.abuse_violations"

    kill_chain:
      - step: craft_payload
        tactic: AML.TA0003
        techniques: [AML.T0065, AML.T0066, AML.T0079]
        abstract_action: >
          Craft prompt injection disguised as benign content,
          designed for RAG retrieval; stage exfiltration endpoint.
      - step: deliver_content
        tactic: AML.TA0004
        techniques: [AML.T0093]
        abstract_action: >
          Deliver crafted content through channel that feeds AI
          assistant's data corpus (email, shared doc, knowledge
          base).
      - step: rag_ingestion
        tactic: AML.TA0006
        techniques: [AML.T0070]
        abstract_action: >
          Content automatically indexed into RAG database,
          establishing dormant injection.
      - step: zero_click_activation
        tactic: AML.TA0005
        techniques: [AML.T0051.001]
        abstract_action: >
          User query triggers RAG retrieval of poisoned content;
          hidden instructions activate without user interaction.
      - step: data_collection
        tactic: AML.TA0009
        techniques: [AML.T0085, AML.T0036]
        abstract_action: >
          Activated injection instructs AI to search accessible
          data for sensitive information.
      - step: rendered_output_exfiltration
        tactic: AML.TA0010
        techniques: [AML.T0077, AML.T0057]
        abstract_action: >
          AI encodes collected data into rendered output element
          (markdown image URL) that client automatically fetches.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048]
        abstract_action: >
          Confidential data exfiltrated to attacker endpoint via
          automatic rendering.

    evidence:
      - source: "AML.CS0024"
        type: "enrichment"
      - source: "AML.CS0021"
        type: "enrichment"
      - source: "AML.CS0029"
        type: "enrichment"

  # ═══════════════════════════════════════════════════════════════════
  # AP-T3-04 — Exposed agent control interface exploitation (CS0048).
  # Gamma template. Exposed API or management interface allows direct
  # agent manipulation.
  # ═══════════════════════════════════════════════════════════════════

  AP-T3-04:
    id: "AP-T3-04"
    threat_id: "T3"
    name: "Exposed agent control interface exploitation"
    description: >
      An attacker discovers an AI agent's management or control
      interface exposed on the public internet with weak or absent
      authentication. Through this interface the attacker harvests
      plaintext credentials for connected services, sends arbitrary
      prompts to exploit the agent's instruction-following behavior,
      and escalates to host-level access via the agent's tool
      capabilities. The harvested credentials enable lateral movement
      across the agent's entire connected service ecosystem.

    prerequisite_capabilities:
      min_zones: ["input", "tool_execution"]
      kc_requires:
        any: [KC6.1.1, KC6.1.2, KC6.2.1, KC6.2.2, KC6.4, KC6.5]

    nist_classification:
      attacker_goal: "abuse"
      attacker_knowledge: "gray_box"
      learning_stage: "deployment"

    kill_chain:
      - step: reconnaissance
        tactic: AML.TA0002
        techniques: [AML.T0000, AML.T0006, AML.T0095]
        abstract_action: >
          Scan for exposed agent control interfaces using search
          engines or port scanners.
      - step: initial_access
        tactic: AML.TA0004
        techniques: [AML.T0049, AML.T0012]
        abstract_action: >
          Access exposed interface exploiting weak auth, proxy
          misconfiguration, or default credentials.
      - step: config_credential_harvest
        tactic: AML.TA0013
        techniques: [AML.T0083, AML.T0055]
        abstract_action: >
          Access agent configuration, harvest plaintext credentials
          for connected services.
      - step: arbitrary_prompting
        tactic: AML.TA0005
        techniques: [AML.T0051.000]
        abstract_action: >
          Send arbitrary prompts via control interface to exploit
          agent's instruction-following.
      - step: system_discovery
        tactic: AML.TA0008
        techniques: [AML.T0069, AML.T0084]
        abstract_action: >
          Prompt agent to reveal system prompt, environment
          variables, and internal configuration.
      - step: env_credential_harvest
        tactic: AML.TA0013
        techniques: [AML.T0055, AML.T0098]
        abstract_action: >
          Prompt agent to execute commands (e.g., `env`) harvesting
          additional secrets.
      - step: privilege_escalation
        tactic: AML.TA0012
        techniques: [AML.T0053, AML.T0105]
        abstract_action: >
          Prompt agent to invoke privileged tools (e.g., bash as
          root) for elevated host access.
      - step: cover_tracks
        tactic: AML.TA0007
        techniques: [AML.T0092]
        abstract_action: >
          Use harvested API keys to manipulate agent's chat history,
          covering tracks.
      - step: lateral_movement
        tactic: AML.TA0015
        techniques: [AML.T0091.000]
        abstract_action: >
          Use harvested API keys and credentials to pivot to
          connected services (messaging, cloud, integrations).
      - step: exfiltration
        tactic: AML.TA0010
        techniques: [AML.T0025]
        abstract_action: >
          Exfiltrate conversation histories and data from
          connected services.
      - step: impact
        tactic: AML.TA0011
        techniques: [AML.T0048, AML.T0048.003]
        abstract_action: >
          Access user's entire digital footprint, enabling
          impersonation and data theft.

    evidence:
      - source: "AML.CS0048"
        type: "direct_demonstration"
